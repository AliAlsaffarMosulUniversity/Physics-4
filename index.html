  {sn:'6.3',t:'Refraction and its Laws',p:'84–85',blocks:[
   {fig:REFR_SVG,cap:'Figures (6.8) and (6.9)'},
   {p:L('From a less dense to a denser medium (air → glass) the ray bends <b>toward</b> the normal: θ₁ > θ₂. From a denser to a less dense medium it bends <b>away</b> from the normal: θ₁ < θ₂. A ray falling perpendicularly is not refracted.','من وسط أقل كثافة إلى أكثر كثافة (هواء ← زجاج) ينكسر الشعاع <b>مقتربًا</b> من العمود: θ₁ > θ₂. ومن الأكثر كثافة إلى الأقل ينكسر <b>مبتعدًا</b> عن العمود: θ₁ < θ₂. والشعاع الساقط عموديًا لا ينكسر.')},
   {box:'def',label:'Laws of refraction',list:[
     L('<b>First law:</b> the incident ray, the refracted ray and the normal all lie in one plane perpendicular to the separating surface.','<b>القانون الأول:</b> الشعاع الساقط والشعاع المنكسر والعمود تقع جميعها في مستوٍ واحد عمودي على السطح الفاصل.'),
     L('<b>Second law:</b> the ratio of the sine of the incidence angle to the sine of the refraction angle is constant.','<b>القانون الثاني:</b> النسبة بين جيب زاوية السقوط وجيب زاوية الانكسار مقدار ثابت.')]}
  ]},
  {sn:'6.4',t:'Index of Refraction and Snell’s Law',p:'86–90',blocks:[
   {eq:`₁n₂ = ${fr('sin θ₁','sin θ₂')} = ${fr('v₁','v₂')} = ${fr('λ₁','λ₂')} = ${fr('n₂','n₁')}`},
   {p:L('<b>Relative index of refraction ₁n₂</b>: from the first medium to the second.','<b>معامل الانكسار النسبي ₁n₂</b>: من الوسط الأول إلى الثاني.')},
   {box:'def',label:'Absolute index of refraction',list:[L('<b>n = c / v</b>: the ratio of the speed of light in vacuum to its speed in the medium. It has no unit; for vacuum n = 1; for any material n > 1.','<b>n = c / v</b>: النسبة بين سرعة الضوء في الفراغ وسرعته في الوسط. ليس له وحدة، وللفراغ n = 1، ولأي مادة n > 1.')]},
   {table:{h:['Material','n','Material','n'],r:[['Air','1.00029','Water','1.33'],['Water vapour','1.00025','Acetone','1.36'],['CO₂','1.00045','Glycerin','1.47'],['Polystyrene','1.49','Window glass','1.52'],['Sodium chloride','1.54','Zircon','1.92'],['Diamond','2.42','—','—']],cap:'Table (2) — sodium light 589 nm, 20 °C'}},
   {eq:'n₁ sin θ₁ = n₂ sin θ₂   (Snell’s law)'},
   {box:'rem',label:'Remember',list:[L('“The absolute index of refraction of water is 1.33” means the speed of light in vacuum is 1.33 times its speed in water.','عبارة "معامل الانكسار المطلق للماء 1.33" تعني أن سرعة الضوء في الفراغ تساوي 1.33 مرة سرعته في الماء.')]}
  ]},
  {sn:'6.5',t:'Critical Angle and Total Internal Reflection',p:'90–93',blocks:[
   {box:'def',label:'Critical angle',list:[L('<b>Critical angle θc:</b> the angle of incidence in the denser medium for which the refraction angle in the less dense medium is 90°.','<b>الزاوية الحرجة:</b> زاوية السقوط في الوسط الأكثر كثافة التي تقابلها زاوية انكسار 90° في الوسط الأقل كثافة.')]},
   {fig:TIR_SVG,cap:'Figure (6.12) — rays 1, 2 refract; ray 3 at the critical angle; ray 4 totally reflected'},
   {eq:`sin θc = ${fr('n₂','n₁')}      n = ${fr('1','sin θc')}  (to air)`},
   {box:'rem',label:'Conditions of total internal reflection',list:[L('1) Light travels from a denser medium to a less dense medium. 2) The incidence angle is greater than the critical angle.','1) ينتقل الضوء من وسط أكبر كثافة ضوئية إلى وسط أقل كثافة. 2) زاوية السقوط أكبر من الزاوية الحرجة.')]},
   {p:L('<b>Diamond:</b> n ≈ 2.42 and θc ≈ 24.4°, one of the smallest critical angles, so light undergoes many internal reflections before leaving — this is its brilliance.','<b>الماس:</b> n ≈ 2.42 و θc ≈ 24.4°، من أصغر الزوايا الحرجة، فيعاني الضوء انعكاسات داخلية كثيرة قبل خروجه، وهذا سبب تألقه.')},
   {p:L('<b>Reflecting prism</b> (45°–90°–45°) turns light by 90° or 180°. Used in prism binoculars and submarine periscopes. It is better than a plane mirror: total internal reflection reflects about 100%, while a mirror absorbs some light (about 90% reflected), so the image is sharper and brighter.','<b>الموشور العاكس</b> (45°–90°–45°) يغيّر مسار الضوء 90° أو 180°. يُستعمل في الناظور ذي الموشورين وفي بيرسكوب الغواصات. وهو أفضل من المرآة المستوية: لأن الانعكاس الكلي يعكس نحو 100%، بينما المرآة تمتص جزءًا (تعكس نحو 90%)، فتكون الصورة أوضح وأسطع.')},
   {p:L('Mirages are also explained by total internal reflection.','تُفسَّر ظاهرة السراب أيضًا بالانعكاس الكلي الداخلي.')}
  ]},
  {sn:'6.6',t:'Fiber-Optics',p:'94',blocks:[
   {box:'def',label:'Optical fibres',list:[L('Fine glass or plastic fibres that carry light from place to place by total internal reflection, losing very little energy, even when curved. The cladding has a slightly lower refractive index than the core, which keeps light inside.','ألياف رفيعة من الزجاج أو البلاستك تنقل الضوء من مكان إلى آخر بالانعكاس الكلي الداخلي، دون أن تفقد إلا قليلًا من الطاقة حتى لو كانت منحنية. والغلاف معامل انكساره أقل قليلًا من اللب، فيمنع خروج الضوء.')]}
  ]},
  {sn:'6.7',t:'Fiber-Optics Applications',p:'95',blocks:[
   {list:[
     L('1) Medicine: the endoscope (stomach, kidneys) for diagnosis, taking samples, cauterizing or surgery; the arthroscope for knee surgery.','1) الطب: المنظار الداخلي (المعدة، الكلى) للتشخيص وأخذ العينات والكي والعمليات، ومنظار المفاصل لعمليات الركبة.'),
     L('2) Controlling internal parts of machines, electronic devices and nuclear reactors.','2) التحكم في الأجزاء الداخلية للمكائن والأجهزة الإلكترونية والمفاعلات النووية.'),
     L('3) Communication: carrying light and sound data on laser beams across oceans. A pair of copper wires carries about 32 calls; one optical fibre carries more than a million.','3) الاتصالات: نقل المعلومات الضوئية والصوتية على أشعة الليزر عبر المحيطات. زوج أسلاك نحاس ينقل نحو 32 مكالمة، وليف بصري واحد أكثر من مليون مكالمة.')]}
  ]}

 open:[

/* ---------- Chapter 7: Mirrors ---------- */
/* shared ray-diagram drawer for mirrors (kind 'mirror') and lenses (kind 'lens'); f signed (cm), u > 0 (cm) */
window.RAY=function(kind,f,u){
 const W=600,H=240,cx=kind==='mirror'?390:300,ay=120;
 const inf=Math.abs(u-f)<1e-9;const v=inf?Infinity:1/(1/f-1/u);const M=inf?Infinity:-v/u;
 const vf=isFinite(v)?v:0;
 const leftNeed=Math.max(u, kind==='mirror'?Math.max(vf>0?vf:0,f>0?2*f:0):Math.max(vf<0?-vf:0,Math.abs(f)))*1.08;
 const rightNeed=(kind==='mirror'?Math.max(vf<0?-vf:0,f<0?-2*f:0):Math.max(vf>0?vf:0,Math.abs(f)))*1.08;
 const s=Math.min((cx-20)/leftNeed, rightNeed>0?(W-cx-20)/rightNeed:Infinity);
 const h=Math.min(46,95/Math.max(1,isFinite(M)?Math.abs(M):1));
 const ox=cx-u*s, top=ay-h;
 let ix=null, itop=null;
 if(isFinite(v)){ ix = kind==='mirror' ? cx - v*s : cx + v*s; itop = ay - M*h; }
 const F1=kind==='mirror'?cx-f*s:cx-f*s, F2=kind==='lens'?cx+f*s:null;
 const C=kind==='mirror'?cx-2*f*s:null;
 const mk=(x,l)=>x>=0&&x<=W?`<line x1="${x}" y1="${ay-4}" x2="${x}" y2="${ay+4}" stroke="var(--ink)"/><text x="${x}" y="${ay+18}" text-anchor="middle">${l}</text>`:'';
 const ext=(px,py,dx,dy,len)=>{const n=Math.hypot(dx,dy)||1;return [px+dx/n*len,py+dy/n*len]};
 let rays='';
 const pts=[[cx,top],[cx,ay]];
 if(itop!==null){ pts.forEach(([px,py])=>{ rays+=`<line x1="${ox}" y1="${top}" x2="${px}" y2="${py}" stroke="var(--amber)" stroke-width="2"/>`;
   const real=(kind==='mirror'&&v>0)||(kind==='lens'&&v>0);
   const dx=real?ix-px:px-ix, dy=real?itop-py:py-itop;
   const [ex,ey]=ext(px,py,dx,dy,real?Math.hypot(ix-px,itop-py)+80:260);
   rays+=`<line x1="${px}" y1="${py}" x2="${ex}" y2="${ey}" stroke="var(--amber)" stroke-width="2"/>`;
   if(!real) rays+=`<line x1="${px}" y1="${py}" x2="${ix}" y2="${itop}" stroke="var(--amber)" stroke-width="1.4" stroke-dasharray="4 4"/>`; });
 } else { rays+=`<line x1="${ox}" y1="${top}" x2="${cx}" y2="${top}" stroke="var(--amber)" stroke-width="2"/>`; }
 const dev=kind==='mirror'
  ? (f>0?`<path d="M${cx-14} 20 Q${cx+10} 120 ${cx-14} 220" stroke="var(--c7)" stroke-width="4" fill="none"/>`:`<path d="M${cx+10} 20 Q${cx-14} 120 ${cx+10} 220" stroke="var(--c7)" stroke-width="4" fill="none"/>`)
  : (f>0?`<path d="M${cx} 20 Q${cx+18} 120 ${cx} 220 Q${cx-18} 120 ${cx} 20" fill="var(--c8)" opacity=".35" stroke="var(--c8)"/>`:`<path d="M${cx-10} 20 L${cx+10} 20 Q${cx} 120 ${cx+10} 220 L${cx-10} 220 Q${cx} 120 ${cx-10} 20" fill="var(--c8)" opacity=".35" stroke="var(--c8)"/>`);
 const arrow=(x,y1,y2,col,dash)=>`<line x1="${x}" y1="${y1}" x2="${x}" y2="${y2}" stroke="${col}" stroke-width="3" ${dash?'stroke-dasharray="5 4"':''}/><path d="M${x-6} ${y2+(y2<y1?8:-8)} L${x} ${y2} L${x+6} ${y2+(y2<y1?8:-8)}" stroke="${col}" stroke-width="3" fill="none"/>`;
 const svg=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;background:var(--paper);border-radius:8px" role="img" aria-label="Ray diagram"><g font-family="IBM Plex Mono, monospace" font-size="11" fill="var(--muted)">
 <line x1="0" y1="${ay}" x2="${W}" y2="${ay}" stroke="var(--muted)"/>${dev}${mk(F1,kind==='mirror'?'F':'F')}${F2!==null?mk(F2,'F′'):''}${C!==null&&C>0&&C<W?mk(C,'C'):''}
 ${rays}${arrow(ox,ay,top,'var(--ink)')}${itop!==null&&ix>-50&&ix<W+50?arrow(ix,ay,itop,(v>0)?'var(--c7)':'var(--c6)',v<0):''}
 <text x="${ox}" y="${top-6}" text-anchor="middle" fill="var(--ink)">object</text>${itop!==null&&ix>0&&ix<W?`<text x="${ix}" y="${Math.min(itop,ay)-6}" text-anchor="middle">image</text>`:''}</g></svg>`;
 let desc;
 if(!isFinite(v)) desc='No image: the rays leave parallel (object at the focus).';
 else desc=`${v>0?'Real':'Virtual'}, ${M<0?'inverted':'erect'}, ${Math.abs(Math.abs(M)-1)<1e-6?'same size':Math.abs(M)>1?'magnified':'diminished'} (M = ${(+M.toFixed(3))})`;
 return {svg,v,M,desc};
};

CHD[7]={
 obj:[L('Describe the image in a plane mirror and the number of images in angled mirrors.','وصف الصورة في المرآة المستوية وعدد الصور في المرآتين المتقاطعتين.'),

 lessons:[
  {sn:'7.1',t:'Plane Mirror',p:'98',blocks:[
   {p:L('A plane mirror is a flat smooth surface that reflects light regularly. Everyday mirrors are polished glass with one face coated with silver or aluminium compounds. Its quality depends on the glass or metal and the degree of polishing.','المرآة المستوية سطح مستوٍ أملس يعكس الضوء انعكاسًا منتظمًا. والمرايا المستعملة زجاج مصقول طُلي أحد وجهيه بمركبات الفضة أو الألمنيوم. وتعتمد كفاءتها على نوع الزجاج أو الفلز ودرجة الصقل.')}
  ]},
  {sn:'7.2',t:'Images in a Plane Mirror',p:'98–99',blocks:[
   {box:'def',label:'The image in a plane mirror is',list:[L('Virtual (cannot be projected on a screen), erect, the same size as the object, at the same distance behind the mirror as the object is in front, and laterally reversed (right ↔ left).','وهمية (لا يمكن استلامها على حاجز)، معتدلة، بحجم الجسم نفسه، وبعدها خلف المرآة يساوي بعد الجسم أمامها، ومقلوبة جانبيًا (اليمين ↔ اليسار).')]},
   {p:L('That is why AMBULANCE is written reversed on the front of ambulances: the driver ahead reads it correctly in his mirror.','لهذا تُكتب كلمة AMBULANCE معكوسة على مقدمة سيارات الإسعاف، فيقرؤها السائق الذي أمامها صحيحة في مرآته.')}
  ]},
  {sn:'7.3',t:'Multiple Images in Angled Mirrors',p:'100–101',blocks:[
   {eq:`n = ${fr('360°','θ')} − 1`},
   {p:L('θ is the angle between the two mirrors. Two parallel facing mirrors (θ = 0) give an infinite number of images, as at the barber.','θ هي الزاوية بين المرآتين. والمرآتان المتوازيتان المتقابلتان (θ = 0) تعطيان عددًا لا نهائيًا من الصور، كما عند الحلاق.')}
  ]},
  {sn:'7.4',t:'Spherical Mirrors',p:'101–103',blocks:[
   {p:L('A spherical mirror is part of a spherical surface. <b>Concave:</b> the inner face reflects. <b>Convex:</b> the outer face reflects.','المرآة الكروية جزء من سطح كرة. <b>المقعرة:</b> سطحها العاكس هو الداخلي. <b>المحدبة:</b> سطحها العاكس هو الخارجي.')},
   {fig:MIRROR_TYPES_SVG,cap:'Figures (7.9) and (7.10)'},
   {table:{h:['Term','Meaning'],r:[['Centre of curvature C','centre of the sphere the mirror was cut from'],['Pole V','centre point of the mirror’s surface'],['Principal axis','line through C and the pole'],['Radius of curvature R','radius of that sphere'],['Focus F','point where reflected rays (or extensions) of rays parallel to the axis meet'],['Focal length f','distance from pole to focus; f = ½ R']],cap:'Book p. 102'}},
   {box:'rem',label:'Rays for drawing images',list:[
     L('1) A ray parallel to the axis reflects through F (concave) or as if from the virtual F (convex).','1) الشعاع الموازي للمحور ينعكس مارًا بالبؤرة (المقعرة) أو كأنه صادر من البؤرة الوهمية (المحدبة).'),
     L('2) A ray through F (or toward it) reflects parallel to the axis.','2) الشعاع المار بالبؤرة (أو المتجه نحوها) ينعكس موازيًا للمحور.'),
     L('3) A ray through C (or toward it) reflects back on itself.','3) الشعاع المار بمركز التكور (أو المتجه نحوه) يرتد على نفسه.')]},
   {p:L('A <b>real image</b> is formed by the reflected rays themselves and can be caught on a screen. A <b>virtual image</b> is formed by their extensions.','<b>الصورة الحقيقية</b> تتكون من التقاء الأشعة المنعكسة نفسها ويمكن استلامها على حاجز. و<b>الصورة الوهمية</b> تتكون من التقاء امتداداتها.')}
  ]},
  {sn:'7.5',t:'Image in a Concave Mirror',p:'104–105',blocks:[

  {sn:'7.6',t:'Image in a Convex Mirror',p:'105–106',blocks:[

   {h:'Spherical aberration'},
   {p:L('<b>Spherical aberration:</b> the failure of the rays reflected from a spherical mirror to meet at one point. Rays far from the pole cross nearer the mirror than F. It is reduced by making the mirror parabolic, or by using spherical mirrors with a small face (light reflectors, reflecting telescopes).','<b>الزيغ الكروي:</b> عدم تجمع الأشعة المنعكسة عن سطح المرآة الكروية في نقطة واحدة؛ فالأشعة البعيدة عن القطب تلتقي في نقطة أقرب إلى المرآة من البؤرة. ويُعالج بجعل المرآة على شكل قطع مكافئ، أو باستعمال مرايا كروية صغيرة الفتحة (العاكسات، المقاريب العاكسة).')}
  ]},
  {sn:'7.7',t:'General Equation of Spherical Mirrors',p:'106–107',blocks:[
   {eq:`${fr('1','f')} = ${fr('1','u')} + ${fr('1','v')}`},

CHD[8]={
 obj:[L('Distinguish converging and diverging lenses and their types.','التمييز بين العدسات اللامة والمفرقة وأنواعها.'),
      L('Define the optical centre, principal axis, focus, focal length and secondary axis.','تعريف المركز البصري والمحور الأساس والبؤرة والبعد البؤري والمحور الثانوي.'),

 lessons:[
  {sn:'8.1',t:'Thin Lenses',p:'115',blocks:[
   {p:L('A lens is a transparent material with two spherical surfaces, or one spherical and one plane surface. It is made of glass for visible light, quartz for ultraviolet and germanium for far infrared. A thin lens has a thickness small compared to its focal length.','العدسة مادة شفافة لها سطحان كرويان، أو سطح كروي وآخر مستوٍ. تُصنع من الزجاج للضوء المرئي، ومن الكوارتز للأشعة فوق البنفسجية، ومن الجرمانيوم للأشعة تحت الحمراء البعيدة. والعدسة الرقيقة سمكها صغير مقارنة ببعدها البؤري.')},
   {fig:LENSES_SVG,cap:'Figures (8.1) and (8.2)'},
   {table:{h:['Type','Shape','Kinds'],r:[['Converging (convex)','centre thicker than edge','biconvex · convex–concave · plano–convex'],['Diverging (concave)','centre thinner than edge','double-concave · convex–concave · plano–concave']],cap:'Book p. 115'}},
   {box:'rem',label:'Remember',list:[L('A converging lens is like two prisms base to base; a diverging lens is like two prisms vertex to vertex.','العدسة اللامة كموشورين متلاصقين من قاعدتيهما، والمفرقة كموشورين متلاصقين من رأسيهما.')]}
  ]},
  {sn:'8.2',t:'Basic Concepts in Lenses',p:'116–118',blocks:[
   {table:{h:['Term','Meaning'],r:[['Optical centre','a ray through it passes without deviation (the faces there are almost parallel)'],['Principal axis','line through the optical centre and the two foci'],['Focus','point on the principal axis; rays from it (or toward it) leave parallel to the axis'],['Focal length f','distance between the focus and the optical centre'],['Secondary axis','any other straight line through the optical centre']],cap:'Book p. 116–117'}},
   {box:'rem',label:'Rays for drawing images',list:[
     L('Ray 1: parallel to the principal axis ⇒ refracts through the focus F′ on the other side.','الشعاع 1: موازٍ للمحور ⇒ ينكسر مارًا بالبؤرة F′ في الجهة الأخرى.'),
     L('Ray 2: through the optical centre ⇒ continues without deviation.','الشعاع 2: مار بالمركز البصري ⇒ ينفذ دون انحراف.'),
     L('Ray 3: through the focus F ⇒ leaves parallel to the principal axis.','الشعاع 3: مار بالبؤرة F ⇒ يخرج موازيًا للمحور.')]},
   {p:L('Object at 2f from a converging lens ⇒ image real, inverted, same size, at 2f on the other side. Object beyond 2f ⇒ real, inverted, diminished, between F′ and 2F′.','جسم على بعد 2f من عدسة لامة ⇒ صورة حقيقية مقلوبة مساوية على بعد 2f في الجهة الأخرى. جسم أبعد من 2f ⇒ حقيقية مقلوبة مصغرة بين F′ و 2F′.')}
  ]},
  {sn:'8.3',t:'Images by a Converging Lens',p:'118–119',blocks:[
   {table:{h:['Object position','Image','Characteristics'],r:[['at infinity','at F′','real, inverted, a point'],['beyond 2f','between F′ and 2F′','real, inverted, diminished'],['at 2f','at 2F′','real, inverted, same size'],['between F and 2f','beyond 2F′','real, inverted, magnified'],['at F','at infinity','no image'],['between F and the lens','same side as object','virtual, erect, magnified']],cap:'Book p. 118–119'}}
  ]},
  {sn:'8.4',t:'Images by a Diverging Lens',p:'119',blocks:[
   {box:'def',label:'Diverging lens',list:[L('Wherever the object is, the image is <b>virtual, erect, diminished</b>, on the same side as the object, in front of the lens.','أينما كان الجسم تكون الصورة <b>وهمية، معتدلة، مصغرة</b>، في جهة الجسم نفسها أمام العدسة.')]},
   {box:'act',label:'Activity — quick focal length',list:[L('Point the lens at the Sun (or a far tree through the window) and move it until a sharp image forms on paper. The lens–paper distance ≈ f.','وجّه العدسة نحو الشمس (أو شجرة بعيدة من الشباك) وحرّكها حتى تتكون صورة واضحة على الورقة. المسافة بين العدسة والورقة ≈ f.')]}
  ]},
  {sn:'8.5',t:'Lens Law and Magnification',p:'120–125',blocks:[
   {eq:`${fr('1','f')} = ${fr('1','u')} + ${fr('1','v')}      M = ${fr('h′','h')} = −${fr('v','u')}`},
   {box:'rem',label:'Signs (light moving left → right)',list:[
     L('u positive for a real object on the left.','u موجبة للجسم الحقيقي على اليسار.'),
     L('v positive for a real image on the right; negative for a virtual image on the left.','v موجبة للصورة الحقيقية على اليمين، وسالبة للوهمية على اليسار.'),
     L('f positive for a converging lens; negative for a diverging lens.','f موجبة للعدسة اللامة، وسالبة للمفرقة.'),
     L('M positive: virtual, erect. M negative: real, inverted.','M موجب: وهمية معتدلة. M سالب: حقيقية مقلوبة.')]},
   {eq:`${fr('A′','A')} = ${fr('v²','u²')}`},
   {h:'Combination of thin lenses'},
   {p:L('Find the image of the first lens; it becomes the object of the second. Total magnification M = M₁ × M₂.','أوجد صورة العدسة الأولى، فتصبح جسمًا للعدسة الثانية. والتكبير الكلي M = M₁ × M₂.')},
   {eq:`${fr('1','f')} = ${fr('1','f₁')} + ${fr('1','f₂')} − ${fr('d','f₁f₂')}   (in contact, d = 0: ${fr('1','f')} = ${fr('1','f₁')} + ${fr('1','f₂')})`}
  ]},
  {sn:'8.6',t:'Lens Power',p:'126',blocks:[
   {eq:`P = ${fr('1','f (m)')}   (diopter, D)`},
   {p:L('A converging lens of f = 20 cm: P = 1/0.2 = +5 D. A diverging lens of f = 25 cm: P = 1/(−0.25) = −4 D.','عدسة لامة f = 20 cm: P = 1/0.2 = +5 D. وعدسة مفرقة f = 25 cm: P = 1/(−0.25) = −4 D.')},
   {eq:`P = (n − 1)(${fr('1','R₁')} − ${fr('1','R₂')})   (lens-maker’s equation)`}
  ]},
  {sn:'8.7',t:'Spherical Aberration',p:'127–128',blocks:[
   {box:'def',label:'Spherical aberration',list:[L('Parallel rays far from the axis converge closer to the lens than rays near the axis, so they do not meet at one focus. Reduced by a barrier (stop) at the lens edge, or by using a plano-convex lens (telescope objectives, eyeglasses).','الأشعة الموازية البعيدة عن المحور تتجمع أقرب إلى العدسة من الأشعة القريبة منه، فلا تلتقي في بؤرة واحدة. ويقل بوضع حاجز عند حافة العدسة، أو باستعمال عدسة مستوية–محدبة (العدسات الشيئية للمقاريب والنظارات).')]}
  ]},
  {sn:'8.8',t:'Chromatic Aberration',p:'128–129',blocks:[
   {fig:CHROM_SVG,cap:'Figure (8.15) — violet focuses nearer the lens than red'},
   {box:'def',label:'Chromatic aberration',list:[L('The refractive index of glass differs for each wavelength, so the colours of white light focus at different points on the axis (violet nearest, red farthest).','يختلف معامل انكسار الزجاج باختلاف الطول الموجي، فتتجمع ألوان الضوء الأبيض في نقاط مختلفة على المحور (البنفسجي أقربها والأحمر أبعدها).')]},
   {p:L('<b>Treatment:</b> an achromatic lens — a converging crown-glass lens (f₁, large positive power) cemented to a diverging flint-glass lens (f₂, small negative power); their dispersions cancel. 1/f = 1/f₁ + 1/f₂.','<b>المعالجة:</b> عدسة لا لونية — عدسة لامة من زجاج التاج (f₁ قدرة موجبة كبيرة) ملصقة بعدسة مفرقة من زجاج الصوان (f₂ قدرة سالبة صغيرة)، فيلغي تفريق إحداهما تفريق الأخرى. 1/f = 1/f₁ + 1/f₂.')}
  ]},
  {sn:'8.9',t:'Applications of Lenses',p:'129–133',blocks:[
   {table:{h:['Use','Lens / idea'],r:[['Myopia (short sight)','images in front of the retina ⇒ diverging lens'],['Hyperopia (long sight)','images behind the retina ⇒ converging lens'],['Astigmatism','irregular curvature of cornea/lens ⇒ cylindrical lens'],['Camera','converging lens, object beyond 2f ⇒ real, inverted, diminished on the film'],['Simple magnifier','converging lens of short f, object inside f ⇒ virtual, erect, magnified'],['Compound microscope','short-f objective (object just beyond f) + longer-f eyepiece'],['Projectors (data show, cinema)','object between F and 2F ⇒ real, inverted, magnified'],['Refracting (astronomical) telescope','wide long-f objective + short-f eyepiece'],['Reflecting telescope','concave mirror instead of the objective lens']],cap:'Book p. 129–133'}}
  ]}

  {ty:'open',k:'Define',q:L('Define: Optical centre.','عرّف: المركز البصري.'),x:L('The point at the centre of the lens through which a ray passes without deviation.','النقطة في مركز العدسة التي إذا مر بها شعاع نفذ دون انحراف.')},

 init(){const d=()=>{const f=+$('#lK').value*Math.abs(+$('#lF').value),u=+$('#lU').value;const r=RAY('lens',f,u);$('#lSvg').innerHTML=r.svg;
  $('#lOut').innerHTML=steps([['u',u+' cm'],['Law',`1/v = 1/${f} − 1/${u}`],['v',isFinite(r.v)?(+r.v.toFixed(2))+' cm':'∞'],['P',`1/f = ${(+(100/f).toFixed(2))} D`]])+`<div class="res">✓ ${r.desc}</div>`};['lK','lF','lU'].forEach(i=>$('#'+i).oninput=d);d();}});

CHD[9]={
 obj:[L('State the properties of electric charge and Q = ne.','ذكر خواص الشحنة الكهربائية والعلاقة Q = ne.'),
      L('Apply Coulomb’s law to two or three point charges.','تطبيق قانون كولوم على شحنتين أو ثلاث شحنات نقطية.'),
      L('Classify materials by conductivity and describe charge distribution on conductors.','تصنيف المواد حسب توصيلها الكهربائي ووصف توزيع الشحنات على الموصلات.'),
      L('Calculate electric field, flux, potential, potential difference and work.','حساب المجال والفيض والجهد وفرق الجهد والشغل.'),
      L('Explain equipotential surfaces, earthing, lightning and electrostatic applications.','تفسير سطوح تساوي الجهد والتأريض والبرق وتطبيقات الكهربائية الساكنة.')],
 lessons:[
  {sn:'9.1',t:'Electric Charge',p:'137',blocks:[
   {box:'def',label:'Properties of electric charge',list:[
     L('1) Unlike charges attract; like charges repel.','1) الشحنات المختلفة تتجاذب والمتشابهة تتنافر.'),
     L('2) Electric charge is conserved.','2) الشحنة الكهربائية محفوظة.'),
     L('3) Charge is quantized: any charge is a whole multiple of the electron charge e.','3) الشحنة مكمّاة: أي شحنة مضاعف صحيح لشحنة الإلكترون e.')]},
   {eq:'Q = n · e      e = 1.6 × 10⁻¹⁹ C'},
   {box:'dyk',label:'Did you know?',list:[L('There are six kinds of quarks inside the nucleus: three with +2/3 and three with −1/3 of the proton’s charge.','يوجد داخل النواة ستة أنواع من الكواركات: ثلاثة شحنتها +2/3 وثلاثة −1/3 من شحنة البروتون.')]}
  ]},
  {sn:'9.2',t:'Coulomb’s Law',p:'138–140',blocks:[
   {p:L('Coulomb used a torsion balance he designed: the twist of a bar hung by a thin fibre measured the force between two charged balls.','استعمل كولوم ميزان اللي الذي صممه: مقدار التواء قضيب معلق بخيط رفيع يقيس القوة بين كرتين مشحونتين.')},
   {box:'def',label:'Coulomb’s law',list:[L('The electric force between two point charges is directly proportional to the product of the charges and inversely proportional to the square of the distance between them.','القوة الكهربائية بين شحنتين نقطيتين تتناسب طرديًا مع حاصل ضرب الشحنتين وعكسيًا مع مربع المسافة بينهما.')]},
   {eq:`F = k ${fr('q₁ q₂','r²')}      k = ${fr('1','4πε₀')} = 9 × 10⁹ N·m²/C²`},
   {p:L('ε₀ = 8.85 × 10⁻¹² C²/N·m² is the permittivity of free space. In an insulating medium of greater permittivity the force is smaller. The forces on the two charges are equal and opposite (Newton’s third law).','ε₀ = 8.85 × 10⁻¹² C²/N·m² سماحية الفراغ. وفي وسط عازل سماحيته أكبر تكون القوة أصغر. والقوتان على الشحنتين متساويتان ومتعاكستان (القانون الثالث لنيوتن).')}
  ]},
  {sn:'9.3',t:'Electric Conductivity',p:'141',blocks:[
   {table:{h:['Type','Why','Examples'],r:[['Insulators','electrons tightly bound to nuclei','rubber, glass, mica, dry silk, distilled water'],['Conductors','valence electrons move freely','silver (best), copper, aluminium'],['Semiconductors','between conductors and insulators','silicon (Si), germanium (Ge) — transistors, diodes, solar cells']],cap:'Book p. 141'}}
  ]},
  {sn:'9.4',t:'Charge Distribution on Conductors',p:'141–143',blocks:[
   {p:L('Activity with a charged metal net: when it is bent, only the papers on the outer surface repel. <b>Charges stay on the outer surface of an isolated charged conductor</b> because like charges repel.','نشاط الشبكة المعدنية المشحونة: عند ثنيها تتنافر الأوراق على السطح الخارجي فقط. <b>تستقر الشحنات على السطح الخارجي للموصل المشحون المعزول</b> لأن الشحنات المتشابهة تتنافر.')},
   {eq:`σ = ${fr('q','A')}   (C/m²)`},
   {box:'rem',label:'Remember',list:[L('Charges concentrate at sharp points, where the charge density is greatest.','تتركز الشحنات عند الرؤوس المدببة حيث تكون كثافة الشحنة أكبر.')]}
  ]},
  {sn:'9.5',t:'The Electric Field',p:'144–149',blocks:[
   {p:L('The electric field is the space around a charge where an electric force acts on a positive test charge. It is a vector.','المجال الكهربائي هو الحيز المحيط بالشحنة الذي تظهر فيه قوة كهربائية على شحنة اختبار موجبة. وهو كمية متجهة.')},
   {eq:`E = ${fr('F','q′')}      E = k ${fr('q','r²')}   (N/C)`},
   {fig:FIELD_SVG,cap:'Field lines (solid) and equipotential surfaces (dashed)'},
   {box:'def',label:'Electric field lines',list:[
     L('Leave positive charges and end on negative charges, perpendicular to the charged surfaces.','تخرج من الشحنات الموجبة وتنتهي في السالبة، عمودية على السطوح المشحونة.'),
     L('The tangent at any point gives the direction of the field there.','المماس في أي نقطة يحدد اتجاه المجال فيها.'),
     L('They never intersect; they repel and tend to be as short as possible.','لا تتقاطع، وتتنافر وتميل لأن تكون أقصر ما يمكن.')]},
   {table:{h:['Field','Description','Example'],r:[['Homogeneous','same magnitude and direction everywhere; parallel equally spaced lines','between two wide parallel plates with equal opposite charges'],['Non-homogeneous','changes from point to point','around a point charge or charged sphere']],cap:'Book p. 146–147'}},
   {p:L('Inside a charged conducting sphere E = 0, because all the charge is on its outer surface.','داخل الكرة الموصلة المشحونة E = 0، لأن الشحنة كلها على سطحها الخارجي.')}
  ]},
  {sn:'9.6',t:'Electric Flux',p:'150–151',blocks:[
   {p:L('The electric flux Φ is the number of field lines crossing a surface perpendicularly. It increases with the field and with the area.','الفيض الكهربائي Φ هو عدد خطوط المجال التي تخترق سطحًا عموديًا. ويزداد بزيادة المجال والمساحة.')},
   {eq:'Φ = E<sub>⊥</sub> · A   (N·m²/C)'}
  ]},
  {sn:'9.7',t:'Electric Potential',p:'152–153',blocks:[
   {box:'def',label:'Electric potential',list:[L('The electric potential energy per unit charge at a point in the field. It is a scalar, measured in volts; positive near a positive charge and negative near a negative charge.','الطاقة الكامنة الكهربائية لوحدة الشحنات عند نقطة في المجال. وهو كمية قياسية تقاس بالفولت؛ موجب قرب الشحنة الموجبة وسالب قرب السالبة.')]},
   {eq:`V = ${fr('W','q')}      V = k ${fr('q','r')}`}
  ]},
  {sn:'9.8',t:'Potential Difference',p:'153–155',blocks:[
   {p:L('The potential difference between A and B is the work needed to move a positive charge between them divided by that charge.','فرق الجهد بين A و B هو الشغل اللازم لنقل شحنة موجبة بينهما مقسومًا على تلك الشحنة.')},
   {eq:`V<sub>AB</sub> = ${fr('W<sub>AB</sub>','q')}  ⇒  W = q · V<sub>AB</sub>      E = ${fr('V<sub>AB</sub>','x')}  (potential gradient, V/m)`},
   {box:'rem',label:'Remember',list:[L('The electric field always points toward lower potential.','يكون اتجاه المجال الكهربائي دائمًا نحو الجهد الأقل.')]},
   {box:'dyk',label:'Did you know?',list:[L('A heart stress test (ECG) records potential differences between metal electrodes over time.','فحص الجهد للقلب يسجل فروق الجهد بين أقطاب معدنية مع الزمن.')]}
  ]},
  {sn:'9.9',t:'Equipotential Surfaces',p:'156–160',blocks:[
   {box:'def',label:'Equipotential surface',list:[L('A surface whose points all have the same potential; the potential difference between any two of its points is zero.','سطح جميع نقاطه لها الجهد نفسه، وفرق الجهد بين أي نقطتين عليه صفر.')]},
   {list:[L('Properties: they do not intersect; field lines are perpendicular to them; they get closer where the field is strong (near sharp points). Around a point charge they are concentric spheres; between parallel plates they are parallel planes.','خواصها: لا تتقاطع؛ خطوط المجال عمودية عليها؛ تتقارب حيث يكون المجال قويًا (قرب الرؤوس المدببة). حول الشحنة النقطية كرات متحدة المركز، وبين الصفيحتين المتوازيتين مستويات متوازية.')]},
   {h:'Earth, lightning and applications'},
   {p:L('The Earth’s potential is taken as zero: it is a huge reservoir of charge, so adding or removing charge does not change it. A charged conductor connected to the Earth reaches zero potential.','جهد الأرض يُعد صفرًا: فهي مخزن هائل للشحنات، فلا يتغير جهدها بإضافة شحنة أو أخذها. والموصل المشحون المتصل بالأرض يصبح جهده صفرًا.')},
   {p:L('<b>Lightning:</b> a discharge between parts of a cloud or between two clouds, lasting about 1/1000 s, heating air to about 30 000 °C. The sudden expansion of air makes <b>thunder</b>. A discharge between a cloud and the ground is a <b>lightning stroke</b>.','<b>البرق:</b> تفريغ بين أجزاء الغيمة أو بين غيمتين، يستمر نحو 1/1000 s ويسخن الهواء إلى نحو 30000 °C، والتمدد المفاجئ للهواء يُحدث <b>الرعد</b>. والتفريغ بين غيمة والأرض يُسمى <b>الصاعقة</b>.')},
   {p:L('<b>Lightning arrester:</b> a conductor with a sharp top above the building and its other end in moist ground; it discharges the atmosphere gradually through the sharp point.','<b>مانعة الصواعق:</b> موصل له رأس مدبب فوق البناية وطرفه الآخر في أرض رطبة، يفرغ الشحنة تدريجيًا عبر الرأس المدبب.')},
   {p:L('<b>Applications:</b> electrostatic filters for factory smoke, and the photocopier.','<b>التطبيقات:</b> المرشحات الكهروستاتيكية لدخان المصانع، وآلة الاستنساخ.')}
  ]}

  {t:L('Book: a 2 × 10⁻⁶ C charge between charged parallel plates feels 6 × 10⁻⁴ N along the field. Find E; what force at another point b?','الكتاب: شحنة 2 × 10⁻⁶ C بين صفيحتين مشحونتين تتأثر بقوة 6 × 10⁻⁴ N باتجاه المجال. أوجد E، وما القوة عند نقطة أخرى b؟'),p:'147',steps:[['Type','force along the field ⇒ positive charge'],['E','6 × 10⁻⁴ / 2 × 10⁻⁶ = 300 N/C'],['b','homogeneous field ⇒ same force']],res:'E = 3 × 10² N/C ; F = 6 × 10⁻⁴ N at b'},

 init(){const d=()=>{const q1=+$('#cq1').value,q2=+$('#cq2').value,r=+$('#cr').value;const F=9e9*Math.abs(q1*q2)*1e-12/(r*r);const like=q1*q2>0;
  let x=null,where='';if(q1&&q2){const k=Math.sqrt(Math.abs(q2/q1));if(like){x=r/(1+k);where=`between them, ${(+x.toFixed(3))} m from q₁`}else if(Math.abs(q1)!==Math.abs(q2)){const xx=r/(1-k);x=xx; where=xx>0?`outside, beyond q₂, ${(+xx.toFixed(3))} m from q₁`:`outside, beyond q₁, ${(+Math.abs(xx).toFixed(3))} m from q₁`}else where='none (equal and opposite charges)'}
  const X=v=>60+v/r*400;const col=q=>q>0?'var(--bad)':'var(--c9)';
  $('#cSvg').innerHTML=`<g font-family="IBM Plex Mono, monospace" font-size="11"><line x1="10" y1="45" x2="510" y2="45" stroke="var(--muted)"/><circle cx="60" cy="45" r="14" fill="${col(q1)}"/><circle cx="460" cy="45" r="14" fill="${col(q2)}"/><text x="60" y="80" text-anchor="middle" fill="var(--muted)">q₁</text><text x="460" y="80" text-anchor="middle" fill="var(--muted)">q₂</text>${x!==null&&X(x)>0&&X(x)<520?`<circle cx="${X(x)}" cy="45" r="6" fill="var(--good)"/><text x="${X(x)}" y="25" text-anchor="middle" fill="var(--good)">F = 0</text>`:''}</g>`;
  $('#cOut2').innerHTML=steps([['F',`k|q₁q₂|/r² = ${sci(F)} N`],['Type',like?'repulsion':'attraction']])+`<div class="res">✓ Null point: ${where}</div>`};['cq1','cq2','cr'].forEach(i=>$('#'+i).oninput=d);d();}});

function steps(st){return `<div class="sol">${st.map(([k,v],i)=>`<div class="step"><span class="k">${i+1}</span><div class="v"><span class="tag">${k}</span> <span class="f">${v}</span></div></div>`).join('')}</div>`}

function chapter(){
 const c=CH[S.ch-1], D=CHD[S.ch];
 const head=`<button class="back" data-go="chapters">← All chapters</button>
 <div class="ch-head" style="--cc:var(${c.c})"><div class="num">CHAPTER ${c.n} · BOOK PAGES ${c.p}</div><h1>${c.t}</h1><div style="font-family:var(--arabic);color:var(--muted);direction:rtl;text-align:left">${c.ar}</div></div>`;
 if(!D){
  const pq=[];PAPERS.forEach(p=>p.qs.forEach(q=>{if(q.ch===c.n)pq.push({p,q})}));
  return head+`<div class="soon-box" style="--cc:var(${c.c})"><b>Lessons in this chapter</b><ul class="list" style="margin-top:8px">${c.s.map(s=>`<li>${s}</li>`).join('')}</ul>
  <p class="lead" style="margin:8px 0 0">Full lessons and quizzes for this chapter are coming next. Its past-paper questions are ready below.</p></div>
  <div class="sec-h"><h2>Past-paper questions · Chapter ${c.n}</h2><span class="eyebrow">${pq.length} solved</span></div>
  ${pq.map(({p,q})=>pqCard(p,q)).join('')||'<div class="empty">No past-paper questions for this chapter yet.</div>'}`;
 }
 const pqn=PAPERS.reduce((n,p)=>n+p.qs.filter(q=>q.ch===c.n).length,0);
 const tabs=[['lessons','Lessons'],['laws','Laws'],['examples','Worked Examples'],['quiz','Quiz'],['exam','Exam-Style'],['book','From the Book'],...(pqn?[['past','Past Papers']]:[]),['summary','Summary']];
 if(!tabs.some(t=>t[0]===S.tab)) S.tab='lessons';
 let body='';
 if(S.tab==='lessons'){
  body=`<div class="box def"><span class="bl">Objectives</span>${D.obj.map(o=>T(o)).join('')}</div>`+
  D.lessons.map(ls=>`<section class="lesson"><h2><span class="sn">${ls.sn}</span>${ls.t}</h2><span class="pg">Book p. ${ls.p}</span>${ls.blocks.map(blk).join('')}</section>`).join('');
 } else if(S.tab==='laws'){
  body=`<div class="laws">${D.laws.map(l=>`<article class="law"><h3>${l.t}</h3><div class="eq">${l.eq}</div><dl>${l.d.map(([a,b])=>`<dt>${a}</dt><dd>${b}</dd>`).join('')}</dl>${T(l.use)}${l.err?`<div class="tip"><b>Common mistake</b>${T(l.err,'span')}</div>`:''}</article>`).join('')}</div>`;
 } else if(S.tab==='examples'){
  body=D.examples.map((e,i)=>`<article class="qcard"><div class="qhead"><span class="qn">Example ${i+1}</span><span class="tag">Book p. ${e.p}</span></div>${T(e.t)}${solBlock(e)}</article>`).join('');
 } else if(S.tab==='quiz'){ body=quiz(D); }
 else if(S.tab==='exam'){
  body=`${T(L('Questions written in the style of distinguished-school exams. Try first, then open the solution.','أسئلة مكتوبة بأسلوب امتحانات مدارس المتميزين. حاول أولًا ثم افتح الحل.'),'p','lead')}`+
  D.exam.map((e,i)=>`<article class="qcard"><div class="qhead"><span class="qn">ES-${i+1}</span><span class="tag">${e.m} marks</span></div>${T(e.q)}<button class="btn" data-reveal>Show solution</button><div class="reveal" hidden>${solBlock(e)}</div></article>`).join('');
 } else if(S.tab==='book'){
  const B=D.book;
  body=(B.mcq&&B.mcq.length?`<div class="sec-h"><h2>Q1 · Choose the correct answer</h2><span class="tag">Book p. ${B.p||''}</span></div>`+
  B.mcq.map((m,i)=>mcqCard({q:L(m.q,m.ar),o:m.o,a:m.a},'fb'+i,`Q1-${i+1}`,'From the Book')).join(''):'')+
  (B.open&&B.open.length?`<div class="sec-h"><h2>${B.openTitle||'Answer the following'}</h2></div>`+
  B.open.map(([q,a])=>`<article class="qcard">${T(q)}<button class="btn" data-reveal>Show answer</button><div class="reveal" hidden>${typeof a==='string'?`<div class="res">✓ ${a}</div>`:T(a)}</div></article>`).join(''):'')+
  (B.probs&&B.probs.length?`<div class="sec-h"><h2>Problems</h2></div>`+
  B.probs.map(p=>`<article class="qcard">${T(p.q)}<button class="btn" data-reveal>Show solution</button><div class="reveal" hidden>${solBlock(p)}</div></article>`).join(''):'');
 } else if(S.tab==='past'){
  const pq=[];PAPERS.forEach(p=>p.qs.forEach(q=>{if(q.ch===c.n)pq.push({p,q})}));

  const fs=FS.find(f=>f.ch===c.n);

  <div class="fs">${fs?`<div class="fsc" style="--cc:var(${c.c})"><h3>Laws</h3><ul>${fs.items.map(([a,b])=>`<li><span>${a}</span><span class="f">${b}</span></li>`).join('')}</ul></div>`:''}
  ${D.extra?`<div class="fsc" style="--cc:var(${c.c})"><h3>${D.extra.t}</h3><ul>${D.extra.items.map(([a,b])=>`<li><span>${a}</span><span class="f">${b}</span></li>`).join('')}</ul></div>`:''}</div>`;
 }
 return head+`<div class="tabs" role="tablist" style="--cc:var(${c.c})">${tabs.map(([k,t])=>`<button role="tab" data-tab="${k}" aria-selected="${S.tab===k}">${t}</button>`).join('')}</div><div style="--cc:var(${c.c})">${body}</div>`;
}

function blk(b){
 if(b.p) return T(b.p);
 if(b.h) return `<h3 style="font-size:17px;margin:18px 0 8px">${b.h}</h3>`;
 if(b.eq) return `<div class="eq">${b.eq}</div>`;
 if(b.fig) return `<figure>${b.fig}<figcaption>${b.cap}</figcaption></figure>`;
 if(b.table) return `<div class="tblw"><table><thead><tr>${b.table.h.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${b.table.r.map(r=>`<tr>${r.map((c,i)=>`<td class="${/\d/.test(c)&&i>0?'n':''}">${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div><figcaption>${b.table.cap}</figcaption>`;
 if(b.box) return `<div class="box ${b.box}"><span class="bl">${b.label}</span>${b.list.map(x=>T(x)).join('')}</div>`;
 if(b.list) return b.list.map(x=>T(x)).join('');
 return '';
}

function mcqCard(q,id,label,kind){
 return `<article class="qcard"><div class="qhead"><span class="qn">${label}</span><span class="tag">${kind}</span></div>${T(q.q)}
 <div class="opts">${q.o.map((o,i)=>`<button class="opt" data-pick="${i}" data-ans="${q.a}"><span class="L">${'abcd'[i]}</span><span class="en">${o}</span></button>`).join('')}</div>
 <div class="fb"></div></article>`;
}
function quiz(D){
 const Q=D.quiz,p=prog['q'+S.ch]||{};
 const kinds=['All',...new Set(Q.map(q=>q.k.split(' ·')[0]))];
 const ans=Object.keys(p).length,ok=Object.values(p).filter(Boolean).length;
 let list=Q.map((q,i)=>({q,i}));
 if(S.qf==='Wrong') list=list.filter(({i})=>p['q'+i]===false); else if(S.qf!=='All') list=list.filter(({q})=>q.k.startsWith(S.qf));
 return `<div class="qtools">${[...kinds,'Wrong'].map(k=>`<button class="chip" data-qf="${k}" aria-pressed="${S.qf===k}">${k==='Wrong'?'Retry wrong':k}</button>`).join('')}
 <span class="score">Score <b>${ok}</b> / ${ans} answered · ${Q.length} total</span></div>
 ${list.length?list.map(({q,i})=>qCard(q,i,S.ch)).join(''):'<div class="empty">Nothing here yet. Answer some questions first.</div>'}
 <div class="btnrow"><button class="btn b" data-reset>Reset my answers for this chapter</button></div>`;
}
function qCard(q,i,n){
 const st=(prog['q'+n]||{})['q'+i];
 const cls=st===true?'ok':st===false?'no':'';
 let inner='';
 if(q.ty==='mcq') inner=`<div class="opts">${q.o.map((o,j)=>`<button class="opt ${st!==undefined&&j===q.a?'right':''}" data-qi="${i}" data-pick="${j}" ${st!==undefined?'disabled':''}><span class="L">${'abcd'[j]}</span><span class="en">${o}</span></button>`).join('')}</div>`;
 if(q.ty==='tf') inner=`<div class="btnrow"><button class="btn" data-qi="${i}" data-tf="1" ${st!==undefined?'disabled':''}>True</button><button class="btn" data-qi="${i}" data-tf="0" ${st!==undefined?'disabled':''}>False</button></div>`;
 if(q.ty==='open') inner=st===undefined?`<button class="btn" data-open="${i}">Show answer</button>`:'';
 return `<article class="qcard ${cls}" id="Q${n}_${i}"><div class="qhead"><span class="qn">Q${i+1}</span><span class="tag c">${q.k}</span></div>${T(q.q)}${inner}
 <div class="fbk">${st!==undefined?`<div class="verdict ${st?'ok':'no'}">${st?'Correct':'Not quite'}</div>${T(q.x)}`:''}</div></article>`;
}

function pqCard(p,q,mock){
 return `<article class="qcard" style="--cc:${chColor(q.ch)}"><div class="tagline"><span class="tag c">Ch ${q.ch}</span><span class="tag">${p.srcAr}</span><span class="tag">${p.yr}</span><span class="tag">${q.k}</span><span class="tag">${q.m} marks</span>${p.lang==='AR'?'<span class="tag">original in Arabic</span>':''}</div>
 ${T(q.q)}<button class="btn" data-reveal ${mock?'hidden':''}>Show solution</button><div class="reveal" hidden>${solBlock(q)}</div></article>`;
}

function papers(){
 if(S.paper){
  const p=PAPERS.find(x=>x.id===S.paper);
  return `<button class="back" data-paper="">← All papers</button>
  <div class="ptop"><div class="eyebrow">Paper ${p.id} · ${p.lang==='EN'?'English paper':'Arabic paper, rewritten in book terms'}</div><h2>${p.src}</h2>
  <div style="font-family:var(--arabic);direction:rtl;text-align:left;color:var(--muted)">${p.srcAr}</div>
  <div class="tagline" style="margin-top:10px"><span class="tag">${p.yr}</span><span class="tag">${p.ex}</span><span class="tag">Source: ${p.where}</span></div>
  <div class="btnrow"><button class="btn pri" data-mock="${p.id}">${S.mock?'Finish & show all solutions':'Start mock exam (2 h)'}</button>${S.mock?`<span class="timer" id="timer">2:00:00</span>`:''}</div></div>
  ${p.qs.map(q=>pqCard(p,q,S.mock)).join('')}`;
 }
 const f=S.pf;
 const list=PAPERS.filter(p=>(f.lang==='all'||p.lang===f.lang));
 return `<div class="sec-h"><h2>Past Papers</h2><span class="eyebrow">Read from photos of the original papers</span></div>
 ${T(L('Real 4th-scientific physics exams. Every school name, year and number here was checked against the photo of the original paper. Papers that do not name a school are labelled as they appear.','امتحانات فيزياء حقيقية للرابع العلمي. كل اسم مدرسة وسنة ورقم هنا تم التحقق منه من صورة الورقة الأصلية. الأوراق التي لا تذكر اسم مدرسة كُتبت كما وردت.'),'p','lead')}
 <div class="qtools"><label>Chapter <select class="sel" id="pfch"><option value="all">All</option>${CH.map(c=>`<option value="${c.n}" ${f.ch==c.n?'selected':''}>${c.n}. ${c.t}</option>`).join('')}</select></label>
 <label>Language <select class="sel" id="pflang"><option value="all">All</option><option value="EN" ${f.lang==='EN'?'selected':''}>English (distinguished)</option><option value="AR" ${f.lang==='AR'?'selected':''}>Arabic schools</option></select></label></div>
 ${f.ch!=='all'?(list.flatMap(p=>p.qs.filter(q=>q.ch==+f.ch).map(q=>pqCard(p,q))).join('')||'<div class="empty">No questions for this chapter in the selected papers.</div>'):
 `<div class="papers">${list.map(p=>`<button class="paper" data-paper="${p.id}"><span class="code">${p.id}</span><span style="min-width:0"><h3>${p.src}</h3><span class="sub">${p.yr} · ${p.ex} · ${p.qs.length} solved</span></span><span class="lang tag">${p.lang}</span></button>`).join('')}</div>`}`;
}

function formulas(){
 return `<div class="sec-h"><h2>Formula Sheet</h2><span class="eyebrow">All nine chapters</span></div>
 <div class="fs">${FS.map(g=>{const c=CH[g.ch-1];return `<div class="fsc" style="--cc:var(${c.c})"><h3>${c.n}. ${c.t}</h3><ul>${g.items.map(([a,b])=>`<li><span>${a}</span><span class="f">${b}</span></li>`).join('')}</ul></div>`}).join('')}</div>
 <div class="box rem" style="margin-top:16px"><span class="bl">Constants used in the book</span>${T(L('c water = 4200 · c ice = 2093 · c steam = 2010 J/kg·°C · Lf ice = 335 kJ/kg · Lv = 2260 kJ/kg · h = 6.63 × 10⁻³⁴ J·s · c = 3 × 10⁸ m/s · k = 9 × 10⁹ N·m²/C²','ثوابت الكتاب: الحرارة النوعية للماء 4200 وللجليد 2093 وللبخار 2010 J/kg·°C، الحرارة الكامنة للانصهار 335 kJ/kg وللتبخر 2260 kJ/kg، ثابت بلانك 6.63 × 10⁻³⁴ J·s، سرعة الضوء 3 × 10⁸ m/s، ثابت كولوم 9 × 10⁹.'))}</div>`;
}

/* ---------- labs ---------- */
const LABS=[];
function labs(){
 return `<div class="sec-h"><h2>Labs</h2><span class="eyebrow">${LABS.length} simulations</span></div>`+
 LABS.map(l=>`<section class="lab" style="--cc:var(${CH[l.ch-1].c})"><div class="tagline"><span class="tag c">Chapter ${l.ch}</span></div><h3>${l.t}</h3>${T(l.d)}${l.html}</section>`).join('');
}
function sci(x){if(!isFinite(x))return '—';if(x===0)return '0';const e=Math.floor(Math.log10(Math.abs(x)));const m=x/10**e;return (Math.abs(e)<3)?(+x.toPrecision(4)).toString():`${(+m.toFixed(3))} × 10${String(e).replace('-','⁻').replace(/\d/g,d=>'⁰¹²³⁴⁵⁶⁷⁸⁹'[d])}`}
function initLabs(){LABS.forEach(l=>{try{l.init&&l.init()}catch(e){}})}

LABS.push({ch:2,t:'Hooke’s spring',d:L('Add weight and watch the spring. Up to 0.45 N the spring obeys Hooke’s law (k = 33.3 N/m, as in Table 1). Beyond that the elasticity limit is passed.','زِد الثقل وراقب النابض. حتى 0.45 N يخضع النابض لقانون هوك (k = 33.3 N/m كما في الجدول 1). بعد ذلك يتجاوز حد المرونة.'),
 html:`<div class="lab-grid"><svg id="springSvg" viewBox="0 0 200 300" style="width:100%;max-width:200px;background:var(--paper);border-radius:8px"></svg>
  <div><label for="fr" class="eyebrow">Force F (N)</label><input type="range" id="fr" min="0" max="0.6" step="0.05" value="0.2">
   <div class="readout"><div><span>F</span><b id="rF">0.20 N</b></div><div><span>ΔL</span><b id="rL">0.60 cm</b></div><div><span>k</span><b>33.3 N/m</b></div></div>
   <svg id="graph" viewBox="0 0 320 180" style="width:100%;margin-top:10px;background:var(--paper);border-radius:8px"></svg><div id="hk"></div></div></div>`,
 init(){const frEl=$('#fr');const k=33.33,lim=0.45;const dlf=F=>F<=lim?F/k:lim/k+(F-lim)/k*3.2;
  const draw=()=>{const F=+frEl.value,dl=dlf(F);
  $('#rF').textContent=F.toFixed(2)+' N';$('#rL').textContent=(dl*100).toFixed(2)+' cm';
  const len=60+dl*100*55;let p='M100 20 v10';for(let i=0;i<12;i++){p+=` L${100+(i%2?-16:16)} ${30+(i+.5)*len/12}`}p+=` L100 ${30+len}`;
  const w=18+F*40;
  $('#springSvg').innerHTML=`<rect x="40" y="10" width="120" height="10" fill="var(--ink)"/><path d="${p}" fill="none" stroke="${F>lim?'var(--bad)':'var(--c2)'}" stroke-width="3"/><rect x="${100-w/2}" y="${32+len}" width="${w}" height="${w*.7}" rx="3" fill="var(--ink)"/>`;
  const X=v=>30+v/2.4*270, Y=v=>160-v/0.6*140;
  let pts='';for(let f=0;f<=F+1e-9;f+=0.05){pts+=`${X(dlf(f)*100)},${Y(f)} `}
  $('#graph').innerHTML=`<g font-family="IBM Plex Mono, monospace" font-size="10" fill="var(--muted)"><path d="M30 160 H310 M30 160 V12" stroke="var(--muted)" fill="none"/><text x="310" y="174" text-anchor="end">ΔL (cm)</text><text x="34" y="14">F (N)</text>${[0,0.2,0.4,0.6].map(v=>`<text x="26" y="${Y(v)+3}" text-anchor="end">${v}</text>`).join('')}${[0,1,2].map(v=>`<text x="${X(v)}" y="172" text-anchor="middle">${v}</text>`).join('')}<polyline points="${pts}" fill="none" stroke="var(--c2)" stroke-width="2.5"/><circle cx="${X(dl*100)}" cy="${Y(F)}" r="4.5" fill="${F>lim?'var(--bad)':'var(--accent)'}"/><line x1="30" x2="310" y1="${Y(lim)}" y2="${Y(lim)}" stroke="var(--amber)" stroke-dasharray="2 3"/><text x="306" y="${Y(lim)-4}" text-anchor="end" fill="var(--amber)">elasticity limit</text></g>`;
  $('#hk').innerHTML=F>lim?`<div class="alert bad">Elasticity limit passed — plastic (permanent) deformation. The spring will not return to its original length.</div>`:`<div class="alert ok">Within the elasticity limit — ΔL is directly proportional to F.</div>`;};
  frEl.oninput=draw;draw();}});
LABS.push({ch:2,t:'Young modulus calculator',d:L('Enter what you know. The calculator converts units for you and shows the steps.','أدخل ما تعرفه، وستحوّل الحاسبة الوحدات وتعرض الخطوات.'),
 html:`<div class="calc">
   <label>Force F (N)<input id="cF" type="number" value="500" step="any"></label>
   <label>Length L₀ (m)<input id="cL" type="number" value="4" step="any"></label>
   <label>Area<input id="cA" type="number" value="0.05" step="any"></label>
   <label>Area unit<select id="cAu"><option value="1e-4">cm²</option><option value="1e-6">mm²</option><option value="1">m²</option></select></label>
   <label>Material<select id="cM"><option value="200e9">Steel 200×10⁹</option><option value="70e9">Aluminium 70×10⁹</option><option value="120e9">Copper 120×10⁹</option><option value="16e9">Lead 16×10⁹</option><option value="79e9">Gold 79×10⁹</option><option value="360e9">Tungsten 360×10⁹</option><option value="1200e9">Diamond 1200×10⁹</option><option value="65e9">Glass 65×10⁹</option><option value="100e9">Bronze 1×10¹¹</option></select></label>
  </div><div id="cOut" style="margin-top:12px"></div>`,
 init(){const calc=()=>{const F=+$('#cF').value,L0=+$('#cL').value,A=+$('#cA').value*+$('#cAu').value,Y=+$('#cM').value;const dl=F*L0/(Y*A);
  $('#cOut').innerHTML=steps([['A',`${$('#cA').value} ${$('#cAu').selectedOptions[0].text} = ${sci(A)} m²`],['Law',`ΔL = ${fr('F · L₀','Y · A')}`],['Sub',`${fr(`${F} × ${L0}`,`${sci(Y)} × ${sci(A)}`)}`],['Stress',`F/A = ${sci(F/A)} N/m²`]])+`<div class="res">✓ ΔL = ${sci(dl)} m = ${sci(dl*1000)} mm</div>`;};
  ['cF','cL','cA','cAu','cM'].forEach(i=>$('#'+i).oninput=calc);calc();}});
(window.XL||[]).forEach(l=>LABS.push(l));

function glossary(){
 return `<div class="sec-h"><h2>Glossary</h2><span class="eyebrow">${GL.length} terms · tap ▶ to hear</span></div>
 <input class="gsearch" id="gq" placeholder="Search in English or Arabic…" aria-label="Search glossary" value="${S.gq||''}">
 <div class="gl" id="gl">${glItems()}</div>`;
}
function glItems(){const q=(S.gq||'').trim().toLowerCase();return GL.filter(([e,a])=>!q||e.toLowerCase().includes(q)||a.includes(q)).sort((x,y)=>x[2]-y[2]).map(([e,a,c])=>`<div class="gi"><b>${e}</b><span class="a">${a}</span><span class="c">Chapter ${c}</span><button class="say" data-say="${e}" aria-label="Pronounce ${e}"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button></div>`).join('')||'<div class="empty">No term matches.</div>'}

function mistakes(){
 const w=[];for(let n=1;n<=9;n++){const D=CHD[n];if(!D)continue;const p=prog['q'+n]||{};D.quiz.forEach((q,i)=>{if(p['q'+i]===false)w.push({n,q,i})})}
 return `<div class="sec-h"><h2>My Mistakes</h2><span class="eyebrow">${w.length} to review</span></div>
 ${T(L('Every quiz question you get wrong is collected here. Review the explanation, then retry it from the chapter quiz.','كل سؤال تخطئ فيه في الاختبار يُجمع هنا. راجع الشرح ثم أعد المحاولة من اختبار الفصل.'),'p','lead')}
 ${w.length?w.map(({n,q,i})=>`<article class="qcard no" style="--cc:${chColor(n)}"><div class="qhead"><span class="tag c">Chapter ${n}</span><span class="qn">Q${i+1}</span><span class="tag">${q.k}</span></div>${T(q.q)}<div class="verdict ok">Correct answer</div>${q.o?`<p class="f">${q.o[q.a]}</p>`:q.ty==='tf'?`<p class="f">${q.a?'True':'False'}</p>`:''}${T(q.x)}</article>`).join(''):'<div class="empty">No mistakes saved. Take a chapter quiz to start.</div>'}`;
}

function credits(){
 $('#credits').innerHTML=`
 <div class="cr"><span class="av">م</span><div><span class="role">Designed by · Student</span><b>Mohammed Ali Abdulwahab</b><span class="arn">الطالب: محمد علي عبد الوهاب</span></div></div>
 <p class="foot-note">Content follows <i>Physics 4 — Scientific Secondary</i>, Ministry of Education, Republic of Iraq, 5th translated edition (2025). Past papers are reproduced for study from photos shared publicly by students and teachers; sources are listed on each paper.</p>`;
}

/* ---------- router ---------- */
let timerId=null;
function render(){
 document.documentElement.classList.remove('mode-en','mode-tap','mode-both');document.documentElement.classList.add('mode-'+S.mode);
 document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===S.mode));
 const v={home,chapters:chaptersView,chapter,papers,formulas,labs,glossary,mistakes}[S.view]||home;
 const app=$('#app');app.innerHTML=v();app.classList.remove('view');void app.offsetWidth;app.classList.add('view');
 nav(); if(S.view==='labs') initLabs();
 if(S.view==='glossary'){const g=$('#gq');g.oninput=()=>{S.gq=g.value;$('#gl').innerHTML=glItems()}}
 if(S.view==='papers'&&!S.paper){const a=$('#pfch'),b=$('#pflang');a.onchange=()=>{S.pf.ch=a.value;render()};b.onchange=()=>{S.pf.lang=b.value;render()}}
 clearInterval(timerId);
 if(S.mock&&$('#timer')){let left=S.mockLeft;const tick=()=>{const h=Math.floor(left/3600),m=Math.floor(left%3600/60),s=left%60;$('#timer').textContent=`${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;S.mockLeft=left;if(left--<=0){clearInterval(timerId);finishMock()}};tick();timerId=setInterval(tick,1000)}
}
function go(v){
 const m=/^ch([1-9])$/.exec(v); if(m){S.view='chapter';S.ch=+m[1];S.tab='lessons'} else S.view=v;
 if(S.view!=='papers'){S.paper=null;S.mock=false}
 render();window.scrollTo({top:0});try{history.replaceState(null,'',v==='home'?location.pathname:'#'+v)}catch(e){}}
function finishMock(){S.mock=false;render();document.querySelectorAll('.reveal').forEach(r=>r.hidden=false);document.querySelectorAll('[data-reveal]').forEach(b=>b.hidden=true)}

document.addEventListener('click',e=>{
 const t=e.target.closest('button');if(!t)return;
 if(t.classList.contains('trb')){t.parentElement.classList.toggle('open');t.textContent=t.parentElement.classList.contains('open')?'EN':'AR';return}
 if(t.dataset.go){go(t.dataset.go);return}
 if(t.dataset.mode){S.mode=t.dataset.mode;store.set('mode',S.mode);render();return}
 if(t.dataset.ch){go('ch'+t.dataset.ch);return}
 if(t.dataset.tab){S.tab=t.dataset.tab;S.qf='All';render();return}
 if(t.dataset.qf){S.qf=t.dataset.qf;render();return}
 if(t.hasAttribute('data-reveal')){const r=t.nextElementSibling;r.hidden=!r.hidden;t.textContent=r.hidden?t.textContent.replace('Hide','Show'):t.textContent.replace('Show','Hide');return}
 if(t.dataset.paper!==undefined&&!t.dataset.mock){S.paper=t.dataset.paper||null;S.mock=false;render();window.scrollTo({top:0});return}
 if(t.dataset.mock){if(S.mock){finishMock()}else{S.mock=true;S.mockLeft=7200;render()}return}
 if(t.hasAttribute('data-reset')){prog['q'+S.ch]={};saveProg();render();return}
 if(t.dataset.say){try{const u=new SpeechSynthesisUtterance(t.dataset.say);u.lang='en-US';u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(err){}return}
 const n=S.ch, Q=CHD[n]?CHD[n].quiz:null;
 if(t.dataset.qi!==undefined&&Q){const i=+t.dataset.qi,q=Q[i];let ok;if(t.dataset.pick!==undefined)ok=+t.dataset.pick===q.a;else ok=(t.dataset.tf==='1')===q.a;
   P(n)['q'+i]=ok;saveProg();
   $('#Q'+n+'_'+i).outerHTML=qCard(q,i,n);
   if(q.ty==='mcq'&&!ok){$('#Q'+n+'_'+i).querySelectorAll('.opt')[+t.dataset.pick].classList.add('wrong')}
   updScore();return}
 if(t.dataset.open!==undefined&&Q){const i=+t.dataset.open,q=Q[i];const c=$('#Q'+n+'_'+i);t.remove();
   c.querySelector('.fbk').innerHTML=`${T(q.x)}<div class="btnrow"><button class="btn g" data-self="${i}" data-v="1">I got it right</button><button class="btn b" data-self="${i}" data-v="0">I missed it</button></div>`;return}
 if(t.dataset.self!==undefined&&Q){const i=+t.dataset.self;P(n)['q'+i]=t.dataset.v==='1';saveProg();$('#Q'+n+'_'+i).outerHTML=qCard(Q[i],i,n);updScore();return}
 if(t.dataset.pick!==undefined&&t.dataset.ans!==undefined){const card=t.closest('.qcard');const a=+t.dataset.ans,p=+t.dataset.pick;card.querySelectorAll('.opt').forEach((o,j)=>{o.disabled=true;if(j===a)o.classList.add('right');else if(j===p)o.classList.add('wrong')});card.querySelector('.fb').innerHTML=`<div class="verdict ${p===a?'ok':'no'}">${p===a?'Correct':'Answer: '+'abcd'[a]}</div>`;return}
});
function updScore(){const s=$('.score');if(!s)return;const p=prog['q'+S.ch]||{};s.innerHTML=`Score <b>${Object.values(p).filter(Boolean).length}</b> / ${Object.keys(p).length} answered · ${CHD[S.ch].quiz.length} total`}

/* theme */
(function(){const saved=store.get('theme',null);if(saved)document.documentElement.setAttribute('data-theme',saved);
 $('#themeBtn').onclick=()=>{const cur=document.documentElement.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');const nx=cur==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',nx);store.set('theme',nx)}})();

/* migrate old progress key */
if(prog.q2&&Object.keys(prog.q2).some(k=>!/^q\d+$/.test(k))){prog.q2={};saveProg()}
credits();
const h0=(location.hash||'').slice(1);
if(['papers','formulas','labs','glossary','mistakes','chapters'].includes(h0)||/^ch[1-9]$/.test(h0)) go(h0); else render();
</script>

</body>
