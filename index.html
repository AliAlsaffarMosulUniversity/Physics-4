<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Physics 4 Companion</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout: a lab notebook on millimetre graph paper — sticky instrument bar, single reading column, cards only for things you act on */
:root{
  --paper:#F2F5F6; --sheet:#FFFFFF; --ink:#132235; --muted:#5B6B7D; --line:#D5DEE3; --grid:rgba(19,34,53,.045);
  --accent:#0E7C86; --accent-ink:#FFFFFF; --accent-soft:#DDF0F1;
  --amber:#C7781A; --amber-soft:#FBEEDB;
  --good:#1F8A4C; --good-soft:#E1F3E8; --bad:#C23B30; --bad-soft:#FBE4E1;
  --ar-bg:#F6F2E8; --ar-ink:#3B3122;
  --c1:#3A6EA5; --c2:#B4562A; --c3:#1C8A8C; --c4:#C2412E; --c5:#C79A16; --c6:#5D57B8; --c7:#2F7D57; --c8:#9A3C8E; --c9:#2C5BD4;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --arabic:"IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0D1620; --sheet:#14202C; --ink:#E4ECF2; --muted:#93A4B5; --line:#26364A; --grid:rgba(228,236,242,.035);
  --accent:#3FBAC2; --accent-ink:#06191B; --accent-soft:#12343A;
  --amber:#E9A24A; --amber-soft:#3A2A14;
  --good:#4CC27F; --good-soft:#123222; --bad:#F07065; --bad-soft:#3A1A17;
  --ar-bg:#1E1A13; --ar-ink:#EADFC8; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0D1620; --sheet:#14202C; --ink:#E4ECF2; --muted:#93A4B5; --line:#26364A; --grid:rgba(228,236,242,.035);
  --accent:#3FBAC2; --accent-ink:#06191B; --accent-soft:#12343A;
  --amber:#E9A24A; --amber-soft:#3A2A14;
  --good:#4CC27F; --good-soft:#123222; --bad:#F07065; --bad-soft:#3A1A17;
  --ar-bg:#1E1A13; --ar-ink:#EADFC8; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:12px 12px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sheet)}
h1,h2,h3,h4{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--sheet);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px;background:none;border:0;padding:0}
.brand b{font-family:var(--display);font-weight:800;font-size:21px;letter-spacing:-.02em}
.brand span{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.bar .sp{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--paper)}
.seg button{border:0;background:none;padding:5px 11px;font-size:12.5px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
.iconbtn{border:1px solid var(--line);background:var(--paper);border-radius:999px;width:34px;height:34px;display:grid;place-items:center}
.iconbtn svg{width:17px;height:17px}
.nav{display:flex;gap:4px;overflow-x:auto;padding-block:0 8px;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{white-space:nowrap;border:0;background:none;padding:6px 10px;border-radius:8px;font-size:14px;font-weight:500;color:var(--muted)}
.nav button[aria-current="true"]{color:var(--ink);background:var(--accent-soft)}

main{padding-block:24px 64px}
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.lead{color:var(--muted);max-width:62ch}

/* hero */
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:28px;align-items:center;padding-block:8px 28px}
.hero h1{font-size:clamp(34px,6vw,54px);font-weight:800;letter-spacing:-.03em}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{margin:12px 0 0}
.gauge{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:16px}
.gauge svg{width:100%;height:auto;display:block}
.gauge .g-l{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:6px}
@media (max-width:640px){.hero{grid-template-columns:1fr}}

.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:28px}
.quick button{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;display:flex;flex-direction:column;gap:4px;min-width:0}
.quick button b{font-family:var(--display);font-size:16px}
.quick button span{font-size:12.5px;color:var(--muted);line-height:1.35}
.quick button:hover{border-color:var(--accent)}
@media (max-width:640px){.quick{grid-template-columns:1fr 1fr}}

.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:8px 0 12px;flex-wrap:wrap}
.sec-h h2{font-size:24px}

.chapters{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:760px){.chapters{grid-template-columns:1fr 1fr}}
@media (max-width:480px){.chapters{grid-template-columns:1fr}}
.chap{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;display:flex;flex-direction:column;gap:8px;min-width:0;position:relative}
.chap:hover{border-color:var(--cc)}
.chap .num{font-family:var(--mono);font-size:12px;color:var(--cc);font-weight:500;letter-spacing:.05em}
.chap h3{font-size:17.5px;font-weight:700}
.chap .meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin-top:auto}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:999px;border:1px solid currentColor}
.pill.ready{color:var(--good)} .pill.soon{color:var(--muted)}
.chap .bar-p{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.chap .bar-p i{display:block;height:100%;background:var(--cc)}

/* translation blocks */
.tb{position:relative;padding-right:46px;margin:0 0 12px}
.tb > .en{margin:0}
.trb{position:absolute;top:1px;right:0;border:1px solid var(--line);background:var(--sheet);border-radius:6px;font-family:var(--arabic);font-size:12px;font-weight:600;padding:1px 7px;line-height:1.6;color:var(--muted)}
.trb:hover{color:var(--accent);border-color:var(--accent)}
.tb.open > .trb{background:var(--amber-soft);color:var(--amber);border-color:var(--amber)}
.ar{display:none;direction:rtl;text-align:right;font-family:var(--arabic);font-size:16.5px;line-height:1.9;background:var(--ar-bg);color:var(--ar-ink);padding:8px 12px;border-radius:8px;margin-top:6px}
.tb.open > .ar,.mode-both .ar{display:block}
.mode-en .trb,.mode-both .trb{display:none}
.mode-en .tb,.mode-both .tb{padding-right:0}
.ltr{direction:ltr;unicode-bidi:isolate;font-family:var(--body)}

/* chapter page */
.ch-head{padding-block:4px 18px;border-bottom:1px solid var(--line);margin-bottom:18px}
.ch-head .num{font-family:var(--mono);color:var(--cc);font-size:13px;letter-spacing:.06em}
.ch-head h1{font-size:clamp(28px,5vw,40px);font-weight:800;letter-spacing:-.02em;margin-top:4px}
.back{border:0;background:none;color:var(--muted);font-size:14px;padding:0;margin-bottom:10px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:22px;scrollbar-width:thin}
.tabs button{white-space:nowrap;border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:6px 13px;font-size:13.5px;font-weight:500}
.tabs button[aria-selected="true"]{background:var(--cc);border-color:var(--cc);color:#fff}
.lesson{margin-bottom:30px}
.lesson h2{font-size:22px;margin-bottom:4px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.lesson h2 .sn{font-family:var(--mono);font-size:14px;color:var(--cc);font-weight:500}
.pg{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-bottom:12px;display:block}
.box{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin:14px 0;background:var(--sheet)}
.box .bl{font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;margin-bottom:6px;display:block}
.box.dyk .bl{color:var(--c6)} .box.rem .bl{color:var(--c7)} .box.think .bl{color:var(--amber)} .box.act .bl{color:var(--c3)} .box.def .bl{color:var(--cc)}
.box.def{border-color:color-mix(in srgb,var(--cc) 40%,var(--line))}
.list{margin:0 0 12px;padding:0;list-style:none;display:grid;gap:4px}
.list > li{margin:0}
figure{margin:14px 0}
figure svg{width:100%;height:auto;display:block;background:var(--sheet);border:1px solid var(--line);border-radius:var(--r)}
figcaption{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:6px}
.tblw{overflow-x:auto;margin:12px 0}
table{border-collapse:collapse;font-size:14px;min-width:280px;background:var(--sheet)}
th,td{border:1px solid var(--line);padding:6px 12px;text-align:left}
th{font-family:var(--mono);font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:500}
td.n{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* math */
.f{font-family:var(--mono);font-size:15px;white-space:nowrap}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 3px;line-height:1.25}
.frac > span:first-child{border-bottom:1.5px solid currentColor;padding:0 3px}
.frac > span:last-child{padding:0 3px}
.eq{display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--mono);font-size:19px;padding:14px;background:var(--paper);border-radius:8px;margin:10px 0;flex-wrap:wrap;overflow-x:auto}

/* law cards */
.laws{display:grid;gap:14px}
.law{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.law h3{font-size:18px;margin-bottom:4px}
.law dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:10px 0;font-size:14.5px}
.law dt{font-family:var(--mono);font-weight:500;color:var(--cc)}
.law dd{margin:0}
.warn{display:flex;gap:8px;font-size:14px;color:var(--bad);margin-top:8px}

/* worked solution */
.sol{border-left:3px solid var(--accent);padding:4px 0 4px 14px;margin:10px 0}
.step{display:grid;grid-template-columns:22px 1fr;gap:8px;margin-bottom:6px;align-items:start}
.step .k{font-family:var(--mono);font-size:12px;color:var(--muted);padding-top:3px}
.step .v{min-width:0;overflow-x:auto}
.res{display:inline-flex;align-items:center;gap:8px;background:var(--good-soft);color:var(--good);border:1px solid color-mix(in srgb,var(--good) 40%,transparent);padding:6px 12px;border-radius:8px;font-family:var(--mono);font-weight:500;margin:6px 0;flex-wrap:wrap}
.tip{background:var(--amber-soft);border-radius:8px;padding:8px 12px;font-size:14px;margin-top:8px}
.tip b{color:var(--amber);font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;display:block}
.tagline{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.tag{font-family:var(--mono);font-size:11px;padding:1px 8px;border-radius:999px;background:var(--paper);border:1px solid var(--line);color:var(--muted)}
.tag.c{color:var(--cc);border-color:color-mix(in srgb,var(--cc) 45%,var(--line))}

/* questions */
.qtools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:4px 11px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.score{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--muted)}
.score b{color:var(--ink)}
.qcard{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:12px}
.qcard.ok{border-color:color-mix(in srgb,var(--good) 55%,var(--line))}
.qcard.no{border-color:color-mix(in srgb,var(--bad) 55%,var(--line))}
.qhead{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.qn{font-family:var(--mono);font-size:12px;color:var(--muted)}
.opts{display:grid;gap:6px;margin:8px 0}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 12px;width:100%}
.opt .L{font-family:var(--mono);font-size:12.5px;color:var(--muted);padding-top:2px}
.opt .tb{margin:0;flex:1;min-width:0}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.right{background:var(--good-soft);border-color:var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt[disabled]{cursor:default}
.verdict{font-weight:600;font-size:14px;margin:8px 0 4px}
.verdict.ok{color:var(--good)} .verdict.no{color:var(--bad)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.btn{border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:7px 14px;font-size:14px;font-weight:500}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.g{color:var(--good);border-color:var(--good)} .btn.b{color:var(--bad);border-color:var(--bad)}
.reveal{margin-top:10px}

/* papers */
.papers{display:grid;gap:10px}
.paper{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;text-align:left;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;width:100%}
.paper .code{font-family:var(--display);font-weight:800;font-size:26px;color:var(--accent);width:34px;text-align:center}
.paper h3{font-size:16.5px}
.paper .sub{font-size:13px;color:var(--muted)}
.paper .lang{font-family:var(--mono);font-size:11px}
.paper:hover{border-color:var(--accent)}
.sel{border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:6px 10px;font-size:14px;max-width:100%}
.ptop{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:16px}
.ptop h2{font-size:22px}
.timer{font-family:var(--mono);font-size:22px;font-variant-numeric:tabular-nums}
.theory{columns:2;column-gap:24px;font-size:14.5px}
@media (max-width:640px){.theory{columns:1}}
.theory li{break-inside:avoid;margin-bottom:8px}

/* lab */
.lab{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:18px}
.lab-grid{display:grid;grid-template-columns:200px 1fr;gap:16px;align-items:start}
@media (max-width:600px){.lab-grid{grid-template-columns:1fr}}
.lab input[type=range]{width:100%;accent-color:var(--cc)}
.readout{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.readout div{background:var(--paper);border-radius:8px;padding:8px 10px}
.readout span{display:block;font-family:var(--mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.readout b{font-family:var(--mono);font-size:17px;font-variant-numeric:tabular-nums}
.calc{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:600px){.calc{grid-template-columns:1fr 1fr}}
.calc label{font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.calc input,.calc select{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:7px 9px;font-family:var(--mono);font-size:14px;width:100%;min-width:0}
.alert{border-radius:8px;padding:8px 12px;font-size:14px;margin-top:10px}
.alert.bad{background:var(--bad-soft);color:var(--bad)} .alert.ok{background:var(--good-soft);color:var(--good)}

/* glossary */
.gsearch{width:100%;border:1px solid var(--line);background:var(--sheet);border-radius:10px;padding:10px 14px;font-size:15px;margin-bottom:14px}
.gl{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:560px){.gl{grid-template-columns:1fr}}
.gi{background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}
.gi b{font-weight:600}
.gi .a{font-family:var(--arabic);direction:rtl;text-align:right;color:var(--muted);grid-column:1}
.gi .c{font-family:var(--mono);font-size:11px;color:var(--muted);grid-column:1}
.say{grid-row:1/4;grid-column:2;border:1px solid var(--line);background:var(--paper);border-radius:999px;width:32px;height:32px;display:grid;place-items:center}
.say svg{width:15px;height:15px}

/* formula sheet */
.fs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:640px){.fs{grid-template-columns:1fr}}
.fsc{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.fsc h3{font-size:15px;margin-bottom:8px;color:var(--cc)}
.fsc ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.fsc li{display:flex;justify-content:space-between;gap:10px;align-items:center;border-bottom:1px dashed var(--line);padding-bottom:6px;font-size:13.5px;flex-wrap:wrap}
.fsc li:last-child{border-bottom:0}

/* summary + misc */
.sum li{margin-bottom:6px}
.empty{color:var(--muted);text-align:center;padding:30px 10px;border:1px dashed var(--line);border-radius:var(--r)}
.soon-box{background:var(--sheet);border:1px dashed var(--line);border-radius:var(--r);padding:16px;margin-bottom:16px}

/* credits */
.credits{border-top:1px solid var(--line);margin-top:40px;padding-top:22px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:560px){.credits{grid-template-columns:1fr}}
.cr{display:flex;gap:12px;align-items:center}
.cr .av{width:44px;height:44px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:17px;flex:none}
.cr .role{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.cr b{display:block;font-size:15px;line-height:1.3}
.cr .arn{font-family:var(--arabic);font-size:14px;color:var(--muted);direction:rtl}
.foot-note{grid-column:1/-1;font-size:12.5px;color:var(--muted)}

@media (prefers-reduced-motion:no-preference){.view{animation:in .25s ease-out}@keyframes in{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>

<header class="bar">
  <div class="wrap">
    <button class="brand" data-go="home" aria-label="Home"><b>Physics 4</b><span>Companion</span></button>
    <div class="sp"></div>
    <div class="seg" role="group" aria-label="Translation mode">
      <button data-mode="en" aria-pressed="false" title="English only">EN</button>
      <button data-mode="tap" aria-pressed="true" title="Tap AR beside any paragraph">Tap&nbsp;AR</button>

 obj:[L('Name the seven base units and the two supplementary units of the SI system.','تسمية الوحدات الأساسية السبع والوحدتين الإضافيتين في النظام الدولي.'),

  {sn:'1.1',t:'Measurements',p:'5',blocks:[

   {p:L('Human senses are useful but limited in range, trueness and accuracy. The heart pulse, the day (one rotation of the Earth about its axis) and the year (one revolution around the Sun) are natural scales of time.','الحواس البشرية مفيدة لكنها محدودة في المدى والصدق والدقة. نبضات القلب، واليوم (دورة الأرض حول محورها)، والسنة (دورة الأرض حول الشمس) مقاييس طبيعية للزمن.')}

  {sn:'1.2',t:'International System of Units (SI)',p:'6–7',blocks:[

   {table:{h:['#','Quantity','Unit','Symbol'],r:[['1','Length','metre','m'],['2','Mass','kilogram','kg'],['3','Time','second','s'],['4','Electric current','ampere','A'],['5','Amount of substance','mole','mol'],['6','Temperature','kelvin','K'],['7','Luminous intensity','candela','cd']],cap:'Table (1) — the seven base units, Book p. 6'}},

  {sn:'1.3',t:'Measurement Errors',p:'8',blocks:[

   {box:'def',label:'1. Instrument errors',list:[
     L('Caused by poor manufacture or wrong calibration, and by the smallest reading of the device: a metre ruler reads to 1 mm, a micrometer to 0.01 mm. Repeating the reading with the same device does <b>not</b> reduce this error.','تنتج عن رداءة الصنع أو خطأ المعايرة، وعن أصغر قراءة للجهاز: المسطرة المترية تقرأ إلى 1 mm والمايكرومتر إلى 0.01 mm. تكرار القراءة بالجهاز نفسه <b>لا</b> يقلل هذا الخطأ.'),

   {box:'def',label:'2. Personal errors',list:[L('Caused by lack of reading skill or by surrounding conditions. These <b>random errors are the only ones</b> that can be reduced by repeating the measurement and taking the <b>arithmetic mean</b>, the best guess for the true value.','تنتج عن قلة مهارة القراءة أو عن الظروف المحيطة. وهذه <b>الأخطاء العشوائية هي الوحيدة</b> التي تقل بتكرار القياس وأخذ <b>الوسط الحسابي</b>، وهو أفضل تقدير للقيمة الحقيقية.')]},
   {box:'think',label:'Remember',list:[L('A small error measuring a distance on a map with a ruler can mean a big error in the real distance.','الخطأ الصغير في قياس مسافة على الخريطة بالمسطرة قد يعني خطأً كبيرًا في المسافة الحقيقية.')]}

   {box:'act',label:'To plot a graph',list:[

const C2={
 obj:[
  L('Explain why a solid returns to its original shape after a deforming force is removed.','تفسير سبب عودة الجسم الصلب إلى شكله الأصلي بعد زوال القوة المشوِّهة.'),
  L('State Hooke’s law and use F = kΔL to find the spring constant.','ذكر نص قانون هوك واستعمال العلاقة F = kΔL لإيجاد ثابت مرونة النابض.'),
  L('Distinguish between the types of stress and the types of strain.','التمييز بين أنواع الإجهاد وأنواع المطاوعة.'),
  L('Calculate Young modulus, stress, strain and elongation of a wire.','حساب معامل يونك والإجهاد والمطاوعة ومقدار الاستطالة في سلك.'),
  L('Describe the mechanical properties of solids and compare elastic and plastic deformation.','وصف الخواص الميكانيكية للمواد الصلبة والمقارنة بين التشوه المرن والتشوه اللدن.')
 ],
 lessons:[
  {sn:'Intro',t:'Introduction',p:'15',blocks:[
   {p:L('The mechanical properties of a material depend on its behaviour when external forces act on it. Matter has three states — solid, liquid and gas — plus a fourth state called <b>plasma</b>.','تعتمد الخواص الميكانيكية للمادة على سلوكها عند تأثير قوى خارجية فيها. للمادة ثلاث حالات: صلبة وسائلة وغازية، إضافة إلى حالة رابعة تُسمى <b>البلازما</b>.')},
   {p:L('Gases keep neither their shape nor their volume. Liquids keep their volume but not their shape. External forces cause <b>deformation</b> in solids, meaning their shape changes.','الغازات لا تحتفظ بشكلها ولا بحجمها. والسوائل تحتفظ بحجمها لا بشكلها. أما المواد الصلبة فتسبب القوى الخارجية فيها <b>تشوهًا</b>، أي يتغير شكلها.')},
   {box:'def',label:'Factors of deformation',list:[
     L('1. The magnitude of the external force acting on the object.','1. مقدار القوة الخارجية المؤثرة في الجسم.'),
     L('2. The dimensions of the material.','2. أبعاد المادة.'),
     L('3. The material it is made of.','3. نوع المادة المصنوع منها الجسم.')]},
   {p:L('Studying mechanical properties led to new industrial materials such as synthetic fibre, which bears high stress despite its light weight. Applications include aircraft wings, gas cans, tyres, sports equipment, rockets and fuel tanks.','أدت دراسة الخواص الميكانيكية إلى صنع مواد صناعية جديدة، مثل الألياف الصناعية التي تتحمل إجهادًا كبيرًا رغم خفة وزنها. ومن تطبيقاتها: أجنحة الطائرات، وعلب الغاز المضغوط، والإطارات، والأدوات الرياضية، والصواريخ، وخزانات الوقود.')}
  ]},
  {sn:'2.1',t:'Elasticity Concept and Hooke’s Law',p:'16–18',blocks:[
   {p:L('If you pull a rubber rope from both ends it resists, but it stretches. When you let go it returns to its original length. A steel wire with a weight hung on it also stretches slightly, then returns when the weight is removed.','إذا سحبت حبلًا مطاطيًا من طرفيه فإنه يقاوم، لكنه يستطيل. وعندما تتركه يعود إلى طوله الأصلي. وكذلك السلك الفولاذي المعلق به ثقل يستطيل قليلًا، ثم يعود عند إزالة الثقل.')},
   {p:L('<b>Explanation:</b> the wire resists the external force by the <b>molecular attraction forces</b> between its molecules. These forces appear when the shape or length changes, and they restore the object to its original state once the force is gone.','<b>التفسير:</b> يقاوم السلك القوة الخارجية بواسطة <b>قوى التجاذب الجزيئية</b> بين جزيئاته. تظهر هذه القوى عند تغير الشكل أو الطول، وتعيد الجسم إلى حالته الأصلية بعد زوال القوة.')},
   {p:L('Gases and liquids also resist a change in volume when compressed (liquids resist more), and return to their original volume when the pressure is removed.','كذلك تقاوم الغازات والسوائل تغير حجمها عند ضغطها (والسوائل تقاوم أكثر)، وتعود إلى حجمها الأصلي عند زوال الضغط.')},
   {box:'act',label:'Activity — Elasticity concept',list:[

   {eq:`F = k · ΔL`},

   {box:'def',label:'Definitions',list:[
     L('<b>Elasticity:</b> the resistance an object shows to a force that changes its shape, volume or length, and its return to its previous condition after the force is gone.','<b>المرونة:</b> الممانعة التي يبديها الجسم للقوة التي تغير شكله أو حجمه أو طوله، وعودته إلى حالته السابقة بعد زوال القوة.'),
     L('<b>Elasticity limit:</b> the limit beyond which, if the force exceeds it, the object does not return as before after the force is gone — a <b>permanent deformation</b> has happened.','<b>حد المرونة:</b> الحد الذي إذا تجاوزته القوة المؤثرة لا يعود الجسم كما كان بعد زوالها، ويُقال إنه حدث فيه <b>تشوه دائم</b>.')]},
   {box:'rem',label:'The elastic object',list:[

  {sn:'2.2',t:'Stress and Strain',p:'19–21',blocks:[

  {q:L('Q4: Two identical wires, 125 cm and 375 cm. The first is cut by 489 N. Force for the second?','س4: سلكان متماثلان طولاهما 125 cm و 375 cm. قُطع الأول بقوة 489 N. ما القوة لقطع الثاني؟'),steps:[['Rule','cutting depends on area, not length']],res:'F = 489 N'},
  {q:L('Q5: A rod 0.4 m long is shortened by 0.05 m. Relative strain?','س5: قضيب طوله 0.4 m قصر 0.05 m. ما مطاوعته النسبية؟'),steps:[['Law','ΔL / L₀ = 0.05 / 0.4']],res:'0.125'},
  {q:L('Q6: A bronze wire 2.5 m, section 1 × 10⁻³ cm², stretches 1 mm under 0.4 kg (g = 10). Find Y.','س6: سلك برونز طوله 2.5 m ومقطعه 1 × 10⁻³ cm² استطال 1 mm بتعليق 0.4 kg (g = 10). أوجد Y.'),steps:[['F','0.4 × 10 = 4 N'],['A','1 × 10⁻³ × 10⁻⁴ = 1 × 10⁻⁷ m²'],['Y',`${fr('4 × 2.5','1 × 10⁻⁷ × 1 × 10⁻³')}`]],res:'Y = 1 × 10¹¹ N/m²'}
 ]
};

CHD[3]={
 obj:[L('Define a fluid and calculate the pressure of a liquid at a depth.','تعريف المائع وحساب ضغط السائل عند عمق معين.'),
      L('Explain the Torricelli barometer and Pascal’s principle with its applications.','شرح بارومتر تورشيلي ومبدأ باسكال وتطبيقاته.'),
      L('Apply Archimedes’ principle to immersed and floating objects.','تطبيق مبدأ أرخميدس على الأجسام المغمورة والطافية.'),
      L('Explain surface tension, capillarity and viscosity.','تفسير الشد السطحي والخاصية الشعرية واللزوجة.'),
      L('Use the continuity equation and Bernoulli’s principle.','استعمال معادلة الاستمرارية ومبدأ برنولي.')],
 lessons:[
  {sn:'3.1',t:'Fluid',p:'27',blocks:[
   {box:'def',label:'Definition',list:[L('<b>Fluid:</b> a material with weak cohesive forces that cannot keep a certain shape; its particles move and take the shape of their container. This fits liquids and gases.','<b>المائع:</b> مادة قوى التماسك بين جزيئاتها ضعيفة، ولا تحتفظ بشكل معين، فتتحرك دقائقها وتأخذ شكل الإناء الذي توضع فيه. ويشمل السوائل والغازات.')]},
   {box:'dyk',label:'Did you know?',list:[L('Mercury is the metal found in the liquid state at room temperature, so it is a fluid.','الزئبق هو الفلز الموجود في الحالة السائلة بدرجة حرارة الغرفة، لذلك يُعد مائعًا.')]}
  ]},
  {sn:'3.2',t:'Fluid Pressure',p:'27–29',blocks:[
   {eq:`P = ${fr('F<sub>⊥</sub>','A')}   (N/m² = Pascal)`},
   {p:L('<b>1 Pascal</b> is the pressure of a perpendicular force of 1 N on an area of 1 m².','<b>الباسكال</b> هو الضغط الناتج عن قوة عمودية مقدارها 1 N على مساحة 1 m².')},
   {p:L('At depth h the force on area A is the weight of the liquid column above it: F = ρghA. So the liquid pressure is:','عند عمق h تكون القوة على المساحة A هي وزن عمود السائل فوقها: F = ρghA. إذن ضغط السائل:')},
   {eq:'P<sub>h</sub> = ρ g h      P = P₀ + ρ g h'},
   {box:'rem',label:'Remember',list:[L('Liquids are incompressible and their molecules slide easily, so liquid pressure acts in <b>all directions</b>, upward as well as downward.','السوائل غير قابلة للانضغاط وجزيئاتها تنزلق بسهولة، لذلك يؤثر ضغط السائل في <b>جميع الاتجاهات</b>، إلى الأعلى كما إلى الأسفل.')]}
  ]},
  {sn:'3.3',t:'Measuring Atmospheric Pressure',p:'29–30',blocks:[
   {p:L('Atmospheric pressure is the weight of the air column on a unit area. Torricelli’s barometer: a 1 m glass tube full of mercury is inverted in a mercury dish. The mercury settles at <b>76 cm</b> at sea level and 0 °C, leaving an empty space at the top.','الضغط الجوي هو وزن عمود الهواء على وحدة المساحة. بارومتر تورشيلي: أنبوب زجاجي طوله 1 m مملوء بالزئبق يُنكس في حوض زئبق، فيستقر الزئبق عند <b>76 cm</b> عند مستوى سطح البحر و 0 °C، تاركًا فراغًا في أعلاه.')},
   {fig:BARO_SVG,cap:'Figures (3.5) and (3.7)'},
   {p:L('The column height changes with the height of the place above sea level.','يتغير ارتفاع العمود بتغير ارتفاع المكان عن سطح البحر.')},
   {box:'dyk',label:'Did you know?',list:[L('The blood-pressure device is a mercury manometer: normal systolic ≈ 120 mm Hg and diastolic ≈ 80 mm Hg.','جهاز قياس ضغط الدم مانومتر زئبقي: الانقباضي الطبيعي ≈ 120 mm Hg والانبساطي ≈ 80 mm Hg.')]}
  ]},
  {sn:'3.4',t:'Pascal’s Principle',p:'30–31',blocks:[
   {box:'def',label:'Pascal’s principle',list:[L('When an enclosed fluid is exposed to external pressure, that pressure is transmitted <b>equally</b> to all parts of the fluid and to the walls of its container.','عندما يتعرض مائع محصور لضغط خارجي، ينتقل ذلك الضغط <b>بالتساوي</b> إلى جميع أجزاء المائع وإلى جدران الإناء.')]},
   {eq:`${fr('F₁','A₁')} = ${fr('F₂','A₂')}   ⇒   F₂ = F₁ · ${fr('A₂','A₁')}`},
   {p:L('Applications: car brakes, presses, hydraulic hammers and lifts. Oil is used because it has very low compressibility.','التطبيقات: كوابح السيارات، والمكابس، والمطارق والروافع الهيدروليكية. ويُستعمل الزيت لأن قابليته للانضغاط قليلة جدًا.')},
   {box:'dyk',label:'Did you know?',list:[L('The liquid in presses must not freeze or become very viscous at low temperature, must not evaporate, and must not be poisonous or flammable.','يجب ألا يتجمد سائل المكابس أو يزداد لزوجة كثيرًا في درجات الحرارة المنخفضة، وألا يتبخر، وألا يكون سامًا أو قابلًا للاشتعال.')]}
  ]},
  {sn:'3.5',t:'Archimedes’ Principle',p:'31–34',blocks:[
   {box:'def',label:'Archimedes’ principle',list:[L('An object partially or totally immersed in a fluid loses from its weight an amount equal to the weight of the fluid it displaces.','الجسم المغمور كليًا أو جزئيًا في مائع يفقد من وزنه مقدارًا يساوي وزن المائع المزاح.')]},
   {eq:'F<sub>B</sub> = ρ g V = W<sub>air</sub> − W<sub>liquid</sub>'},
   {table:{h:['Case','Forces','Result'],r:[['ρ object > ρ liquid','F<sub>B</sub> < mg','sinks'],['ρ object = ρ liquid','F<sub>B</sub> = mg','suspended in equilibrium'],['ρ object < ρ liquid','F<sub>B</sub> > mg (until floating)','floats']],cap:'Figure (3.9)'}},
   {p:L('For a floating object: weight of the object = weight of displaced liquid, so (ρV)<sub>object</sub> = (ρV)<sub>immersed part in water</sub> using weight densities.','للجسم الطافي: وزن الجسم = وزن السائل المزاح، إذن (ρV) للجسم = (ρV) للجزء المغمور باستعمال الكثافات الوزنية.')}
  ]},
  {sn:'3.6',t:'Surface Tension',p:'35',blocks:[
   {p:L('Molecules inside a liquid are pulled equally in all directions. Surface molecules feel a net force inward, so the surface behaves like a thin stretched elastic membrane and tries to make its area as small as possible.','تتأثر الجزيئات داخل السائل بقوى متساوية في جميع الاتجاهات، أما جزيئات السطح فتتأثر بمحصلة نحو الداخل، فيسلك السطح كغشاء مرن رقيق مشدود ويحاول تقليل مساحته إلى أقل ما يمكن.')},
   {p:L('Examples: a needle floating on water, insects walking on water, spherical drops.','أمثلة: طفو الإبرة على الماء، وسير الحشرات على سطحه، والشكل الكروي للقطرات.')}
  ]},
  {sn:'3.7',t:'Capillary Property',p:'35–36',blocks:[
   {p:L('In a capillary tube water <b>rises</b> above the outside level, while mercury <b>falls</b> below it.','في الأنبوب الشعري <b>يرتفع</b> الماء فوق مستواه في الخارج، بينما <b>ينخفض</b> الزئبق دونه.')},
   {box:'def',label:'Cohesion and adhesion',list:[
     L('<b>Cohesive force:</b> attraction between particles of the same material (mercury–mercury).','<b>قوة التماسك:</b> التجاذب بين جزيئات المادة نفسها (زئبق–زئبق).'),
     L('<b>Adhesive force:</b> attraction between particles of different materials (water–glass).','<b>قوة التلاصق:</b> التجاذب بين جزيئات مواد مختلفة (ماء–زجاج).'),
     L('Water rises because adhesion with glass is greater than its cohesion; mercury falls because its cohesion is greater.','يرتفع الماء لأن تلاصقه مع الزجاج أكبر من تماسكه، وينخفض الزئبق لأن تماسكه أكبر.')]},
   {box:'rem',label:'Importance of capillarity',list:[L('1) Rise of underground water in soil (salt appears on the surface). 2) Rise of water in plant roots and stems. 3) Blood filtration in the kidney. 4) Rise of oil in the wick of an oil heater.','1) صعود المياه الجوفية في مسامات التربة (ظهور الأملاح على السطح). 2) صعود الماء في جذور النبات وسيقانه. 3) ترشيح الدم في الكلية. 4) صعود النفط في فتيل المدفأة.')]}
  ]},
  {sn:'3.8',t:'Dynamic Fluids — the Ideal Fluid',p:'36–37',blocks:[
   {table:{h:['Property of the ideal fluid','Meaning'],r:[['Incompressible','its density stays constant'],['Regular (steady) flow','speed at a point is constant with time'],['Non-viscous','internal friction is zero'],['Irrotational','flow lines do not cross; no eddies']],cap:'Book p. 37'}}
  ]},
  {sn:'3.9',t:'Continuity Equation',p:'37–38',blocks:[
   {box:'def',label:'Continuity',list:[L('The amount of fluid flowing through any section of the pipe per second stays constant.','كمية المائع المارة في أي مقطع من الأنبوب في الثانية تبقى ثابتة.')]},
   {eq:'A₁ v₁ = A₂ v₂'},
   {fig:PIPE_SVG,cap:'Speed is inversely proportional to the cross-section area'}
  ]},
  {sn:'3.10',t:'Bernoulli’s Equation',p:'38–39',blocks:[
   {p:L('Bernoulli (1738): the pressure of a fluid changes when its speed changes. For an ideal fluid, the sum of pressure, kinetic energy per unit volume and potential energy per unit volume is constant along the flow.','برنولي (1738): يتغير ضغط المائع بتغير سرعته. للمائع المثالي يكون مجموع الضغط والطاقة الحركية لوحدة الحجم والطاقة الكامنة لوحدة الحجم ثابتًا على طول المسار.')},
   {eq:'P + ½ρv² + ρgh = constant'},
   {box:'rem',label:'Key idea',list:[L('Where the speed is higher, the pressure is lower. Bernoulli’s principle is based on the law of conservation of energy.','حيث تكون السرعة أكبر يكون الضغط أقل. ويستند مبدأ برنولي إلى قانون حفظ الطاقة.')]}
  ]},
  {sn:'3.11',t:'Applications of Bernoulli’s Principle',p:'39–41',blocks:[
   {list:[
     L('<b>Venturi meter:</b> measures fluid speed from the pressure difference P₁ − P₂ = ρgh read on a mercury manometer.','<b>مقياس فنتوري:</b> يقيس سرعة المائع من فرق الضغط P₁ − P₂ = ρgh المقروء على مانومتر زئبقي.'),
     L('<b>Atomizer:</b> fast air over the vertical tube lowers its pressure; atmospheric pressure (P₀ > P₁) pushes the liquid up, where it breaks into fine drops. Used in car paint sprayers, insecticides, perfume and the carburettor.','<b>المرذاذ:</b> الهواء السريع فوق الأنبوب العمودي يخفض الضغط فيه، فيدفع الضغط الجوي (P₀ > P₁) السائل إلى الأعلى فيتحول إلى قطرات دقيقة. يُستعمل في مرذاذ صبغ السيارات والمبيدات والعطور والمكربن.'),
     L('<b>Aeroplane lift:</b> air moves faster over the upper surface of the wing, so the pressure below is greater, giving an upward lifting force.','<b>قوة رفع الطائرة:</b> يتحرك الهواء فوق السطح العلوي للجناح أسرع، فيكون الضغط تحته أكبر، فتنشأ قوة رفع إلى الأعلى.')]},
   {h:'Viscosity'},
   {box:'def',label:'Definition',list:[L('<b>Viscosity:</b> the friction between the layers of the fluid itself and between the fluid and the walls of its tube. It depends on 1) the type of fluid and 2) its temperature.','<b>اللزوجة:</b> قوة الاحتكاك بين طبقات المائع نفسه وبين طبقاته وجدران الأنبوب الذي يحتويه. وتعتمد على 1) نوع المائع 2) درجة حرارته.')]},
   {p:L('In liquids, viscosity <b>decreases</b> when temperature rises (weaker attraction between particles). In gases it <b>increases</b> (more collisions between particles).','في السوائل <b>تقل</b> اللزوجة بارتفاع درجة الحرارة (يضعف التجاذب بين الدقائق). وفي الغازات <b>تزداد</b> (تكثر التصادمات بين الدقائق).')},
   {box:'think',label:'Think',list:[L('Which engine oil do you advise in summer and in winter? Thicker (more viscous) oil in summer, thinner oil in winter.','أي زيت محرك تنصح به صيفًا وشتاءً؟ زيت أكثر لزوجة صيفًا، وأقل لزوجة شتاءً.')]}
  ]}
 ],
 laws:[
  {t:'Pressure',eq:`P = ${fr('F','A')}`,d:[['P','pressure (Pa = N/m²)'],['F','perpendicular force (N)'],['A','area (m²)']],use:L('Any perpendicular force on an area.','أي قوة عمودية على مساحة.')},
  {t:'Liquid pressure',eq:'P = ρ g h  ;  P<sub>total</sub> = P₀ + ρ g h',d:[['ρ','density (kg/m³)'],['g','9.8 or 10 m/s²'],['h','depth (m)'],['P₀','atmospheric pressure']],use:L('Use the g value given in the question.','استعمل قيمة g المعطاة في السؤال.'),err:L('Forgetting P₀ when the question asks for the total pressure.','نسيان P₀ عندما يطلب السؤال الضغط الكلي.')},
  {t:'Pascal (hydraulic press)',eq:`${fr('F₁','A₁')} = ${fr('F₂','A₂')}`,d:[['F₁, A₁','small piston'],['F₂, A₂','large piston']],use:L('If A₂ = 50 A₁ then F₂ = 50 F₁.','إذا كانت A₂ = 50 A₁ فإن F₂ = 50 F₁.')},
  {t:'Archimedes',eq:'F<sub>B</sub> = ρ g V = W<sub>air</sub> − W<sub>liquid</sub>',d:[['V','immersed volume (m³)'],['ρ','liquid density']],use:L('Floating: W object = ρ g V<sub>immersed</sub>.','الطافي: وزن الجسم = ρ g V للجزء المغمور.')},
  {t:'Continuity',eq:'A₁ v₁ = A₂ v₂',d:[['A','cross-section area'],['v','flow speed']],use:L('For diameters: d₁² v₁ = d₂² v₂.','للأقطار: d₁² v₁ = d₂² v₂.'),err:L('Using the diameter ratio directly instead of its square.','استعمال نسبة القطرين مباشرة بدل مربعها.')},
  {t:'Bernoulli',eq:'P + ½ρv² + ρgh = constant',d:[['P','pressure'],['½ρv²','kinetic energy per volume'],['ρgh','potential energy per volume']],use:L('Venturi: P₁ − P₂ = ρ g h (manometer).','فنتوري: P₁ − P₂ = ρ g h (المانومتر).')}

 examples:[
  {t:L('Book: find the pressure on a diver 20 m below the water surface (ρ = 1000 kg/m³).','الكتاب: احسب الضغط على غواص على عمق 20 m تحت سطح الماء (ρ = 1000 kg/m³).'),p:'29',steps:[['Law','P = ρ g h'],['Sub','1000 × 9.8 × 20']],res:'P = 196 000 N/m²'},
  {t:L('Book: what water column balances 76 cm of mercury? (ρ water 1000, ρ mercury 13 600)','الكتاب: ما طول عمود الماء الذي يعادل 76 cm من الزئبق؟'),p:'30',steps:[['Law','ρ<sub>m</sub> g h<sub>m</sub> = ρ<sub>w</sub> g h<sub>w</sub>'],['Sub','13600 × 0.76 = 1000 × h<sub>w</sub>']],res:'h<sub>w</sub> ≈ 10.33 m'},
  {t:L('Book: force needed to lift a 3000 kg car with a hydraulic lift; small cylinder 15 cm², large 2000 cm² (g = 10).','الكتاب: القوة اللازمة لرفع سيارة 3000 kg بالرافعة الهيدروليكية؛ مقطع الصغيرة 15 cm² والكبيرة 2000 cm² (g = 10).'),p:'31',steps:[['F₂','3000 × 10 = 30 000 N'],['Law','F₁ = F₂ × A₁/A₂'],['Sub','30 000 × 15 / 2000']],res:'F₁ = 225 N'},
  {t:L('Book: an object weighs 5 N in air and 4.55 N in water. Find its volume (g = 10).','الكتاب: جسم وزنه 5 N في الهواء و 4.55 N في الماء. أوجد حجمه (g = 10).'),p:'34',steps:[['F<sub>B</sub>','5 − 4.55 = 0.45 N'],['V','0.45 / (1000 × 10)']],res:'V = 0.45 × 10⁻⁴ m³'},
  {t:L('Book: a wooden cube of side 10 cm and weight density 7840 N/m³ floats on water. Find the immersed length.','الكتاب: مكعب خشبي طول ضلعه 10 cm وكثافته الوزنية 7840 N/m³ يطفو على الماء. أوجد طول الجزء المغمور.'),p:'34',steps:[['Law','(weight density × V)<sub>cube</sub> = (weight density × V)<sub>immersed</sub>'],['Sub','7840 × 0.1³ = 9800 × 0.1² × h']],res:'h = 0.08 m = 8 cm'},
  {t:L('Book: water flows in a pipe from a section of radius 2.5 cm at 2 m/s to a section of radius 1.5 cm. Find the new speed.','الكتاب: يجري الماء في أنبوب من مقطع نصف قطره 2.5 cm بسرعة 2 m/s إلى مقطع نصف قطره 1.5 cm. أوجد السرعة الجديدة.'),p:'38',steps:[['Law','v₂ = v₁ × A₁/A₂ = v₁ (r₁/r₂)²'],['Sub','2 × (2.5/1.5)²']],res:'v₂ ≈ 5.55 m/s'},
  {t:L('Book: Venturi meter — the manometer level difference is 0.075 m of mercury. Find P₁ − P₂.','الكتاب: مقياس فنتوري — فرق مستوى الزئبق في المانومتر 0.075 m. أوجد P₁ − P₂.'),p:'39',steps:[['Law','P₁ − P₂ = ρ g h'],['Sub','13600 × 9.8 × 0.075']],res:'≈ 9.996 × 10³ N/m²'}
 ],
 quiz:[
  {ty:'mcq',k:'MCQ',q:L('The unit N/m² is called:','الوحدة N/m² تُسمى:'),o:['joule','pascal','watt','newton'],a:1,x:L('1 Pa = 1 N/m².','1 Pa = 1 N/m².')},
  {ty:'mcq',k:'MCQ',q:L('At sea level and 0 °C, the mercury column of a barometer is:','عند مستوى سطح البحر و 0 °C يكون عمود الزئبق في البارومتر:'),o:['76 mm','76 cm','10.33 m','1 m'],a:1,x:L('76 cm Hg.','76 cm زئبق.')},
  {ty:'mcq',k:'MCQ',q:L('The pressure applied to an enclosed fluid is transmitted equally according to:','ينتقل الضغط المسلط على مائع محصور بالتساوي حسب:'),o:['Archimedes','Pascal','Bernoulli','continuity'],a:1,x:L('Pascal’s principle.','مبدأ باسكال.')},
  {ty:'mcq',k:'MCQ',q:L('Oil is used in hydraulic lifts because it:','يُستعمل الزيت في الروافع الهيدروليكية لأنه:'),o:['is cheap','has very low compressibility','is heavy','evaporates fast'],a:1,x:L('Book p. 30.','الكتاب صفحة 30.')},
  {ty:'mcq',k:'MCQ',q:L('The weight loss of an immersed object depends on its:','النقص في وزن الجسم المغمور يعتمد على:'),o:['mass','shape','volume','colour'],a:2,x:L('F<sub>B</sub> = ρgV.','F<sub>B</sub> = ρgV.')},
  {ty:'mcq',k:'MCQ',q:L('An object whose density equals the liquid’s density:','جسم كثافته تساوي كثافة السائل:'),o:['floats','sinks','stays suspended in equilibrium','jumps out'],a:2,x:L('F<sub>B</sub> = mg.','F<sub>B</sub> = mg.')},
  {ty:'mcq',k:'MCQ',q:L('Water rises in a glass capillary tube because:','يرتفع الماء في الأنبوب الشعري الزجاجي لأن:'),o:['cohesion > adhesion','adhesion > cohesion','gravity is weak there','the tube is hot'],a:1,x:L('Adhesion of water to glass dominates.','تلاصق الماء بالزجاج هو الغالب.')},
  {ty:'mcq',k:'MCQ',q:L('Mercury in a capillary glass tube:','الزئبق في الأنبوب الشعري الزجاجي:'),o:['rises','falls','stays level','boils'],a:1,x:L('Its cohesion is greater than its adhesion to glass.','تماسكه أكبر من تلاصقه بالزجاج.')},
  {ty:'mcq',k:'MCQ',q:L('If the diameter of a pipe is halved, the flow speed becomes:','إذا نقص قطر الأنبوب إلى النصف، تصبح سرعة الجريان:'),o:['half','double','four times','the same'],a:2,x:L('A ∝ d², so A becomes ¼ and v ×4.','A ∝ d²، فتصبح A الربع و v أربعة أمثال.')},
  {ty:'mcq',k:'MCQ',q:L('Where a fluid moves faster, its pressure is:','حيث يتحرك المائع أسرع يكون ضغطه:'),o:['higher','lower','the same','zero'],a:1,x:L('Bernoulli.','برنولي.')},
  {ty:'mcq',k:'MCQ',q:L('Bernoulli’s principle is based on:','يستند مبدأ برنولي إلى:'),o:['Pascal’s principle','energy conservation','Archimedes','capillarity'],a:1,x:L('Conservation of energy.','حفظ الطاقة.')},
  {ty:'mcq',k:'MCQ',q:L('Which does NOT depend on the Bernoulli effect?','أيها لا يعتمد على تأثير برنولي؟'),o:['atomizer','aeroplane wing','hydraulic press','Venturi meter'],a:2,x:L('The press works by Pascal’s principle.','المكبس يعمل بمبدأ باسكال.')},
  {ty:'mcq',k:'MCQ',q:L('When a liquid is heated, its viscosity:','عند تسخين السائل فإن لزوجته:'),o:['increases','decreases','does not change','becomes infinite'],a:1,x:L('Attraction between particles weakens.','يضعف التجاذب بين الدقائق.')},
  {ty:'mcq',k:'MCQ',q:L('When a gas is heated, its viscosity:','عند تسخين الغاز فإن لزوجته:'),o:['increases','decreases','does not change','becomes zero'],a:0,x:L('More collisions between particles.','تكثر التصادمات بين الدقائق.')},
  {ty:'mcq',k:'MCQ',q:L('To describe the regular flow of a fluid we need its:','لوصف الجريان المنتظم لمائع نحتاج معرفة:'),o:['density, weight, pressure','density and speed only','density, volume, pressure','pressure, density and flow speed'],a:3,x:L('Book Q1-13.','سؤال الكتاب 1-13.')},
  {ty:'tf',k:'True/False',q:L('Liquid pressure acts downward only.','ضغط السائل يؤثر نحو الأسفل فقط.'),a:false,x:L('False → in <b>all directions</b>.','خطأ ← في <b>جميع الاتجاهات</b>.')},
  {ty:'tf',k:'True/False',q:L('The ideal fluid has zero viscosity.','المائع المثالي لزوجته صفر.'),a:true,x:L('True — non-viscous.','صح — غير لزج.')},
  {ty:'tf',k:'True/False',q:L('Surface tension makes a liquid surface try to increase its area.','الشد السطحي يجعل سطح السائل يحاول زيادة مساحته.'),a:false,x:L('False → to <b>decrease</b> its area as much as possible.','خطأ ← <b>تقليل</b> مساحته إلى أقل ما يمكن.')},
  {ty:'tf',k:'True/False',q:L('The atmospheric pressure balances the mercury column in the barometer.','الضغط الجوي يوازن عمود الزئبق في البارومتر.'),a:true,x:L('True.','صح.')},
  {ty:'tf',k:'True/False',q:L('An object denser than a liquid floats on it.','الجسم الأكبر كثافة من السائل يطفو عليه.'),a:false,x:L('False → it <b>sinks</b>.','خطأ ← <b>يغطس</b>.')},
  {ty:'open',k:'Define',q:L('Define: Pascal’s principle.','عرّف: مبدأ باسكال.'),x:L('When an enclosed fluid is exposed to external pressure, the pressure is transmitted equally to all parts of the fluid and the container walls.','عندما يتعرض مائع محصور لضغط خارجي ينتقل الضغط بالتساوي إلى جميع أجزاء المائع وجدران الإناء.')},
  {ty:'open',k:'Define',q:L('Define: Archimedes’ principle.','عرّف: مبدأ أرخميدس.'),x:L('An object immersed partially or totally in a fluid loses from its weight an amount equal to the weight of the displaced fluid.','الجسم المغمور جزئيًا أو كليًا في مائع يفقد من وزنه مقدارًا يساوي وزن المائع المزاح.')},
  {ty:'open',k:'Define',q:L('Define: Viscosity. What does it depend on?','عرّف: اللزوجة. وعلامَ تعتمد؟'),x:L('Friction between the fluid layers and between the fluid and its tube walls. It depends on the fluid type and its temperature.','الاحتكاك بين طبقات المائع وبينها وبين جدران الأنبوب. تعتمد على نوع المائع ودرجة حرارته.')},
  {ty:'open',k:'Give reasons',q:L('Give reasons: a razor blade can rest on still water.','علّل: يمكن وضع شفرة حلاقة على سطح ماء ساكن دون أن تغطس.'),x:L('Surface tension makes the surface act like a stretched elastic membrane that supports the blade.','الشد السطحي يجعل السطح كغشاء مرن مشدود يحمل الشفرة.')},
  {ty:'open',k:'Give reasons',q:L('Give reasons: aluminium roofs fly off during hurricanes.','علّل: تطير السقوف المصنوعة من الألمنيوم أثناء الأعاصير.'),x:L('Fast wind over the roof lowers the pressure above it (Bernoulli); the higher pressure under the roof pushes it up.','الريح السريعة فوق السقف تخفض الضغط فوقه (برنولي)، والضغط الأكبر تحته يدفعه إلى الأعلى.')},
  {ty:'open',k:'Give reasons',q:L('Give reasons: a barefoot swimmer feels less pain on a rough beach as he goes deeper.','علّل: يقل ألم السباح الحافي على الشاطئ الخشن كلما تعمق في الماء.'),x:L('The immersed volume increases, so the buoyant force increases and his apparent weight on his feet decreases.','يزداد الحجم المغمور فتزداد قوة الطفو ويقل وزنه الظاهري على قدميه.')},
  {ty:'open',k:'Give reasons',q:L('Give reasons: liquid surfaces touching capillary tube walls are curved.','علّل: تقعّر سطوح السوائل الملامسة لجدران الأنابيب الشعرية.'),x:L('Because of the difference between adhesive forces (liquid–glass) and cohesive forces (liquid–liquid).','بسبب الفرق بين قوى التلاصق (سائل–زجاج) وقوى التماسك (سائل–سائل).')},
  {ty:'open',k:'Problem · easy',q:L('Find the pressure at the bottom of a pool 5 m deep (ρ = 1000, g = 9.8).','احسب الضغط في قاع مسبح عمقه 5 m.'),x:L('P = 1000 × 9.8 × 5 = <b>49 000 N/m²</b>','P = 1000 × 9.8 × 5 = <b>49 000 N/m²</b>')},
  {ty:'open',k:'Problem · medium',q:L('A person totally immersed in water is about to float. His weight is 600 N. Find his volume (g = 10).','شخص مغمور كليًا في الماء على وشك الطفو، وزنه 600 N. أوجد حجمه (g = 10).'),x:L('F<sub>B</sub> = W ⇒ V = 600/(1000 × 10) = <b>0.06 m³</b>','F<sub>B</sub> = W ⇒ V = 600/(1000 × 10) = <b>0.06 m³</b>')},
  {ty:'open',k:'Problem · medium',q:L('A barometer reads 75 cm Hg. Find the atmospheric pressure (ρ = 13 600, g = 9.8).','قراءة البارومتر 75 cm زئبق. احسب الضغط الجوي.'),x:L('P = 13600 × 9.8 × 0.75 = <b>99 960 Pa</b>','P = 13600 × 9.8 × 0.75 = <b>99 960 Pa</b>')},
  {ty:'open',k:'Problem · hard',q:L('Water speed rises from 1.2 m/s to 6 m/s in a narrowing pipe. Find the ratio of the diameters.','تزداد سرعة الماء من 1.2 m/s إلى 6 m/s في أنبوب يضيق. أوجد نسبة القطرين.'),x:L('A₁/A₂ = 6/1.2 = 5 ⇒ d₁/d₂ = √5 ≈ <b>2.24</b> (the area ratio is 5)','A₁/A₂ = 6/1.2 = 5 ⇒ d₁/d₂ = √5 ≈ <b>2.24</b> (نسبة المساحتين 5)')}
 ],
 exam:[
  {m:12,q:L('Hydraulic press: the big piston area is 60 times the small one; the force on the big piston is 7200 N. Find the force on the small one.','مكبس هيدروليكي مساحة الكبير 60 مرة الصغير، والقوة على الكبير 7200 N. أوجد القوة على الصغير.'),steps:[['Law','F₁ = F₂ A₁/A₂'],['Sub','7200/60']],res:'F₁ = 120 N'},
  {m:12,q:L('A solid weighs 40 N in air and 35 N in water. Find its volume and its density (g = 10).','جسم صلب وزنه 40 N في الهواء و 35 N في الماء. أوجد حجمه وكثافته (g = 10).'),steps:[['F<sub>B</sub>','40 − 35 = 5 N'],['V','5 / 10⁴ = 5 × 10⁻⁴ m³'],['m','40/10 = 4 kg'],['ρ','4 / 5 × 10⁻⁴']],res:'V = 5 × 10⁻⁴ m³ ; ρ = 8000 kg/m³'},
  {m:12,q:L('A rectangular fish pool 20 m × 12 m holds water 5 m deep. Find (a) the pressure on its base (b) the force on the base (g = 9.8).','حوض أسماك مستطيل 20 m × 12 m وعمق الماء فيه 5 m. احسب (أ) الضغط على القاعدة (ب) القوة على القاعدة.'),steps:[['P','1000 × 9.8 × 5 = 49 000 N/m²'],['A','20 × 12 = 240 m²'],['F','49 000 × 240']],res:'P = 4.9 × 10⁴ Pa ; F = 1.176 × 10⁷ N'},
  {m:10,q:L('Water flows at 1.6 m/s in the big section and 3.6 m/s in the small section. Find the ratio of the diameters.','يجري الماء بسرعة 1.6 m/s في المقطع الكبير و 3.6 m/s في الصغير. أوجد نسبة القطرين.'),steps:[['Law','d₁² v₁ = d₂² v₂'],['Ratio','√(3.6/1.6) = 1.5']],res:'d₁ : d₂ = 3 : 2'},
  {m:10,q:L('A wooden cube of side 20 cm and weight density 6000 N/m³ floats on water (weight density 9800 N/m³). Find the immersed depth.','مكعب خشبي ضلعه 20 cm وكثافته الوزنية 6000 N/m³ يطفو على الماء (الكثافة الوزنية 9800). أوجد عمق الجزء المغمور.'),steps:[['Law','6000 × 0.2³ = 9800 × 0.2² × h'],['h','6000 × 0.2 / 9800']],res:'h ≈ 0.122 m ≈ 12.2 cm'},
  {m:8,q:L('Mention the properties of the ideal fluid.','اذكر خواص المائع المثالي.'),steps:[['1','incompressible'],['2','regular (steady) flow'],['3','non-viscous'],['4','irrotational (no eddies)']],res:'4 properties'},
  {m:8,q:L('What is the importance of capillarity?','ما أهمية الخاصية الشعرية؟'),steps:[['1','rise of underground water in soil'],['2','rise of water in plants'],['3','blood filtration in kidneys'],['4','oil rising in a heater wick']],res:'4 applications'},
  {m:8,q:L('Where can the atomizer be used, and how does it work?','أين يُستعمل المرذاذ، وكيف يعمل؟'),steps:[['Work','fast air lowers pressure above the tube; P₀ pushes the liquid up and it breaks into drops'],['Uses','car paint, insecticides, perfume, carburettor']],res:'Bernoulli’s principle'}
 ],

 openTitle:'Q2 · Give reasons',
 open:[
  [L('1. A razor can be placed on still water without sinking.','1. يمكن وضع شفرة حلاقة على سطح ماء ساكن دون أن تغطس.'),L('Surface tension: the surface acts like a stretched elastic membrane.','الشد السطحي: يسلك السطح كغشاء مرن مشدود.')],
  [L('2. A swimming shirt sticks to the body out of the water but not inside it.','2. يلتصق قميص السباحة بالجسم خارج الماء ولا يلتصق داخله.'),L('Out of the water, a thin water film between shirt and skin has a free surface whose tension and adhesion pull them together. Inside the water there is no free surface.','خارج الماء تتكون طبقة ماء رقيقة بين القميص والجلد لها سطح حر، فيجذبهما الشد السطحي والتلاصق. داخل الماء لا يوجد سطح حر.')],
  [L('3. Pressing the inside of a tent with a finger in rain lets water through at that point.','3. عند الضغط على السطح الداخلي للخيمة بالإصبع أثناء المطر ينفذ الماء من تلك النقطة.'),L('The finger breaks the surface-tension film over the fabric pores, so water passes by capillarity.','الإصبع يكسر غشاء الشد السطحي فوق مسامات القماش، فينفذ الماء بالخاصية الشعرية.')],
  [L('4. A wet towel absorbs water from the skin faster than a dry one.','4. المنشفة المبللة تمتص الماء من الجلد أسرع من الجافة.'),L('Water in the towel attracts water on the skin by cohesion, in addition to capillarity in the fibres.','الماء في المنشفة يجذب الماء على الجلد بقوى التماسك، إضافة إلى الخاصية الشعرية في الألياف.')],
  [L('5. Liquid surfaces touching capillary walls are curved.','5. تقعّر سطوح السوائل الملامسة لجدران الأنابيب الشعرية.'),L('The difference between adhesive and cohesive forces.','الفرق بين قوى التلاصق وقوى التماسك.')],
  [L('6. Aluminium roofs fly during hurricanes.','6. تطاير سقوف الألمنيوم أثناء الأعاصير.'),L('Fast air above lowers the pressure (Bernoulli); greater pressure below pushes the roof up.','الهواء السريع فوق السقف يخفض الضغط (برنولي)، والضغط الأكبر تحته يدفعه إلى الأعلى.')],
  [L('7. A barefoot swimmer’s pain on a rough beach decreases as he goes deeper.','7. يقل ألم السباح الحافي على الشاطئ الخشن كلما تعمق.'),L('The buoyant force grows with the immersed volume, reducing his apparent weight.','تزداد قوة الطفو بازدياد الحجم المغمور فيقل وزنه الظاهري.')]
 ],

  {q:L('P1. A fish pool 20 m × 12 m with water 5 m deep. Find (a) the pressure on its base (b) the force on the base.','م1. حوض أسماك 20 m × 12 m وعمق الماء 5 m. احسب (أ) الضغط على القاعدة (ب) القوة.'),steps:[['P','1000 × 9.8 × 5 = 49 000 N/m²'],['F','49 000 × (20 × 12)']],res:'49 000 N/m² ; 1176 × 10⁴ N'},
  {q:L('P2. A mercury barometer reads 75 cm. Find the atmospheric pressure in pascal.','م2. قراءة بارومتر زئبقي 75 cm. أوجد الضغط الجوي بالباسكال.'),steps:[['Law','P = ρ g h'],['Sub','13600 × 9.8 × 0.75']],res:'P = 99 960 Pa'},
  {q:L('P3. Hydraulic press: big piston area = 50 × small; force on big = 6000 N. Find the force on the small piston.','م3. مكبس هيدروليكي مساحة الكبير 50 مرة الصغير والقوة على الكبير 6000 N. احسب القوة على الصغير.'),steps:[['Sub','6000/50']],res:'F₁ = 120 N'},
  {q:L('P4. A person totally immersed in water is about to float; weight 600 N. Find the volume (g = 10).','م4. شخص مغمور كليًا على وشك الطفو، وزنه 600 N. احسب حجمه (g = 10).'),steps:[['Law','W = ρ g V'],['Sub','600/(1000 × 10)']],res:'V = 0.06 m³'},
  {q:L('P5. A solid weighs 20 N in air and 15 N in water. Find its volume.','م5. جسم صلب وزنه 20 N في الهواء و 15 N في الماء. احسب حجمه.'),steps:[['F<sub>B</sub>','5 N'],['V','5/(1000 × 10)']],res:'V = 5 × 10⁻⁴ m³'},
  {q:L('P6. Water speed is 1.2 m/s in the big section and 6 m/s in the small section. Find the ratio between the two diameters.','م6. سرعة الماء 1.2 m/s في المقطع الكبير و 6 m/s في الصغير. احسب النسبة بين القطرين.'),steps:[['Areas','A₁/A₂ = v₂/v₁ = 6/1.2 = 5'],['Diameters','d₁/d₂ = √5']],res:'area ratio 5 ; diameter ratio √5 ≈ 2.24',tip:L('The book’s answer “5” is the ratio of the areas. The ratio of the diameters is √5.','جواب الكتاب "5" هو نسبة المساحتين. أما نسبة القطرين فهي √5.')}
 ]},

  L('P = F/A (Pa); liquid pressure P = ρgh, total P = P₀ + ρgh, in all directions.','P = F/A بالباسكال؛ ضغط السائل ρgh والكلي P₀ + ρgh، وفي جميع الاتجاهات.'),
  L('Barometer: 76 cm Hg at sea level and 0 °C.','البارومتر: 76 cm زئبق عند مستوى سطح البحر و 0 °C.'),

  L('Archimedes: F<sub>B</sub> = ρgV = W<sub>air</sub> − W<sub>liquid</sub>; sink, suspend or float by density.','أرخميدس: F<sub>B</sub> = ρgV = الوزن في الهواء − الوزن في السائل؛ يغطس أو يعلق أو يطفو حسب الكثافة.'),

CHD[4]={
 obj:[L('Calculate the quantity of heat using specific heat and heat capacity.','حساب كمية الحرارة باستعمال الحرارة النوعية والسعة الحرارية.'),
      L('Apply heat lost = heat gained to reach thermal equilibrium.','تطبيق الحرارة المفقودة = الحرارة المكتسبة للوصول إلى الاتزان الحراري.'),
      L('Calculate linear, surface and volume expansion of solids and liquids.','حساب التمدد الطولي والسطحي والحجمي للمواد الصلبة والسوائل.'),
      L('Use latent heat of fusion and vaporization in multi-stage problems.','استعمال الحرارة الكامنة للانصهار والتبخر في المسائل متعددة المراحل.'),
      L('Calculate the rate of heat conduction and explain convection, radiation and thermal pollution.','حساب معدل انتقال الحرارة بالتوصيل وتفسير الحمل والإشعاع والتلوث الحراري.')],
 lessons:[
  {sn:'4.1',t:'Quantity of Heat and Specific Heat',p:'45–47',blocks:[
   {p:L('The sum of the kinetic and potential energies of the particles is the <b>internal energy</b>. Heating raises the internal energy and the temperature.','مجموع الطاقتين الحركية والكامنة لدقائق المادة هو <b>الطاقة الداخلية</b>. والتسخين يرفع الطاقة الداخلية ودرجة الحرارة.')},
   {box:'def',label:'The heat needed depends on',list:[L('1) the mass of the object 2) the change in its temperature 3) the type of material.','1) كتلة الجسم 2) التغير في درجة حرارته 3) نوع المادة.')]},
   {eq:'Q = m · C<sub>p</sub> · ΔT = m C<sub>p</sub> (T₂ − T₁)'},
   {box:'def',label:'Specific heat',list:[L('<b>Specific heat C<sub>p</sub>:</b> the quantity of heat needed to raise the temperature of 1 kg of a material by 1 °C. Unit: J/kg·°C.','<b>الحرارة النوعية:</b> كمية الحرارة اللازمة لرفع درجة حرارة 1 kg من المادة درجة سيليزية واحدة. وحدتها J/kg·°C.')]},
   {p:L('Q and ΔT are positive when the material gains heat and negative when it loses heat.','تكون Q و ΔT موجبتين عندما تكتسب المادة حرارة، وسالبتين عندما تفقدها.')},
   {box:'dyk',label:'Did you know?',list:[L('Heat is also measured in calories: 1 cal = 4.2 J. A burning matchstick produces about 2000 J.','تُقاس الحرارة أيضًا بالسعرة: 1 cal = 4.2 J. وعود الثقاب المشتعل يعطي نحو 2000 J.')]}
  ]},
  {sn:'4.2',t:'Heat Capacity',p:'46–48',blocks:[
   {box:'def',label:'Heat capacity',list:[L('<b>Heat capacity C:</b> the amount of heat needed to raise the temperature of the whole mass of an object by 1 °C. Unit: J/°C.','<b>السعة الحرارية:</b> كمية الحرارة اللازمة لرفع درجة حرارة الكتلة كلها درجة سيليزية واحدة. وحدتها J/°C.')]},
   {eq:'C = m · C<sub>p</sub>   ⇒   Q = C · ΔT'},
   {table:{h:['Material','C<sub>p</sub> (J/kg·°C)','Material','C<sub>p</sub> (J/kg·°C)'],r:[['Water at 15 °C','4186','Glass','837'],['Ice at 0 °C','2093','Steel','500'],['Water vapour at 100 °C','2010','Iron','448'],['Wood','1750','Copper','387'],['Aluminium','900','Silver','234']],cap:'Table (1), Book p. 47 (problems use 4200 for water)'}},
   {box:'rem',label:'Remember',list:[L('Specific heat depends only on the type of material; heat capacity depends on the mass and the material.','الحرارة النوعية تعتمد على نوع المادة فقط، أما السعة الحرارية فتعتمد على الكتلة ونوع المادة.')]},
   {p:L('Water has the largest specific heat of common materials, which explains land and sea breezes and its use for cooling car engines and factory machines.','للماء أكبر حرارة نوعية بين المواد الشائعة، وهذا يفسر نسيم البر والبحر، واستعماله في تبريد محركات السيارات ومكائن المصانع.')}
  ]},
  {sn:'4.3',t:'Thermal Equilibrium',p:'48–50',blocks:[
   {p:L('Heat cannot be created or destroyed; it moves from the hot object to the cold one until their temperatures are equal. In an isolated system:','لا تفنى الحرارة ولا تُستحدث، بل تنتقل من الجسم الساخن إلى البارد حتى تتساوى درجتا حرارتهما. في نظام معزول:')},
   {eq:'Heat lost = Heat gained'},
   {p:L('The <b>calorimeter</b> measures specific heat: a thin copper container inside another, separated by an insulator (sawdust or fibres), with a lid holding a thermometer and a stirrer.','يُستعمل <b>المسعر</b> لقياس الحرارة النوعية: إناء نحاسي رقيق داخل إناء آخر يفصل بينهما عازل (نشارة أو ألياف)، وله غطاء فيه محرار ومحرك.')}
  ]},
  {sn:'4.4',t:'Heat Effect on Materials (Expansion)',p:'51–57',blocks:[
   {p:L('Heating increases the average kinetic energy and the gaps between particles. For equal heat, gases expand more than liquids, and liquids more than solids.','يزيد التسخين متوسط الطاقة الحركية والمسافات بين الدقائق. وعند تساوي الحرارة المكتسبة تتمدد الغازات أكثر من السوائل، والسوائل أكثر من المواد الصلبة.')},
   {table:{h:['Expansion','Law','Coefficient'],r:[['Linear (1D)','ΔL = α L ΔT','α (1/°C)'],['Surface (2D)','ΔA = γ A ΔT','γ = 2α'],['Volume (3D)','ΔV = β V ΔT','β = 3α']],cap:'Book p. 51–53'}},
   {box:'def',label:'Linear expansion coefficient',list:[L('<b>α:</b> the increase in each unit length of a material when heated by 1 °C. Unit 1/°C.','<b>معامل التمدد الطولي α:</b> مقدار الزيادة في وحدة الأطوال من المادة عند تسخينها درجة سيليزية واحدة. وحدته 1/°C.')]},
   {table:{h:['Material','α (1/°C)'],r:[['Aluminium','24 × 10⁻⁶'],['Copper','17 × 10⁻⁶'],['Steel','12 × 10⁻⁶'],['Glass','9 × 10⁻⁶'],['Lead','29 × 10⁻⁶'],['Cement','12 × 10⁻⁶']],cap:'Table (2), Book p. 52'}},
   {fig:BIMETAL_SVG,cap:'Figure (4.10) — bimetallic strip in a thermostat'},
   {p:L('Applications: the automatic thermostat (fridge, iron, fire alarm); lamp glass with the same α as its wire; gaps in bridges and railways.','التطبيقات: المنظم الحراري الأوتوماتيكي (الثلاجة، المكواة، جهاز إنذار الحريق)؛ زجاج المصباح بمعامل تمدد يساوي معامل سلكه؛ ترك فراغات في الجسور وسكك الحديد.')},
   {h:'Liquids'},
   {p:L('When a liquid in a glass flask is heated, its level first <b>drops</b> (the glass expands first) and then <b>rises</b>. What we see is the <b>apparent</b> expansion, less than the real one.','عند تسخين سائل في دورق زجاجي <b>ينخفض</b> مستواه أولًا (لأن الزجاج يتمدد أولًا) ثم <b>يرتفع</b>. وما نشاهده هو التمدد <b>الظاهري</b>، وهو أقل من الحقيقي.')},
   {eq:'β<sub>real</sub> = β<sub>apparent</sub> + 3α<sub>container</sub>'},
   {table:{h:['Liquid','β (× 10⁻⁴ /°C)'],r:[['Alcohol','1.12'],['Gasoline','9.6'],['Glycerin','4.85'],['Mercury','1.85']],cap:'Table (3), Book p. 56'}},
   {h:'Gases'},
   {p:L('Gases expand more than liquids and solids. All gases have the same β at constant pressure: β = 1/273 per °C. The container’s expansion is negligible, so apparent expansion = real expansion.','تتمدد الغازات أكثر من السوائل والمواد الصلبة. ولجميع الغازات المعامل نفسه عند ثبوت الضغط: β = 1/273 لكل °C. ويُهمل تمدد الإناء، فيكون التمدد الظاهري = الحقيقي.')},
   {box:'dyk',label:'Did you know?',list:[L('Pyrex glass withstands fast temperature changes because its linear expansion coefficient is very small.','يتحمل زجاج البايركس التغيرات السريعة في درجة الحرارة لأن معامل تمدده الطولي صغير جدًا.')]}
  ]},
  {sn:'4.5',t:'State Change of Matter',p:'57–60',blocks:[
   {box:'def',label:'Latent heat',list:[
     L('<b>Latent heat of fusion L<sub>f</sub>:</b> the heat needed to convert a unit mass from solid to liquid at the same temperature (melting point) and constant pressure. Unit J/kg.','<b>الحرارة الكامنة للانصهار:</b> كمية الحرارة اللازمة لتحويل وحدة الكتل من الحالة الصلبة إلى السائلة بالدرجة نفسها (درجة الانصهار) وتحت ضغط ثابت. وحدتها J/kg.'),
     L('<b>Latent heat of vaporization L<sub>v</sub>:</b> the heat needed to convert a unit mass from liquid to gas at the boiling point.','<b>الحرارة الكامنة للتبخر:</b> كمية الحرارة اللازمة لتحويل وحدة الكتل من السائل إلى الغاز عند درجة الغليان.')]},
   {eq:'Q = m · L<sub>f</sub>      Q = m · L<sub>v</sub>'},
   {fig:HEATCURVE_SVG,cap:'During melting and boiling the temperature stays constant'},
   {table:{h:['Material','Melting °C','L<sub>f</sub> kJ/kg','Boiling °C','L<sub>v</sub> kJ/kg'],r:[['Water / ice','0','335','100','2260'],['Aluminium','658.7','321','—','—'],['Copper','1083','175','2300','4820'],['Iron','1535','96','3000','6290'],['Mercury','—','—','357','284'],['Silver','—','—','2100','2360']],cap:'Tables (4) and (5), Book p. 57–60'}},
   {p:L('Evaporation happens at the surface at any temperature; boiling happens throughout the liquid at the boiling point.','التبخر يحدث على السطح وبأي درجة حرارة، أما الغليان فيحدث في السائل كله عند درجة الغليان.')}
  ]},
  {sn:'4.6',t:'Methods of Heat Transfer',p:'61–66',blocks:[
   {h:'Conduction'},
   {p:L('Heat moves through solids without the particles moving. Metals conduct well because of free electrons and close atoms; wood, rubber and plastic conduct poorly.','تنتقل الحرارة في المواد الصلبة دون انتقال الدقائق. الفلزات موصلة جيدة بسبب الإلكترونات الحرة وتقارب الذرات، والخشب والمطاط والبلاستك رديئة التوصيل.')},
   {eq:`Thermal gradient = ${fr('ΔT','L')}      H = k A ${fr('ΔT','L')}`},
   {table:{h:['Material','k (W/m·°C)','Material','k (W/m·°C)'],r:[['Silver','406','Steel','46'],['Red copper','385','Mercury','8.7'],['Gold','293','Glass','0.8'],['Aluminium','210','Bricks','0.63'],['Yellow copper','109','Water','0.61'],['Iron','79','Wood','0.15'],['Cement','0.3','Air','0.025']],cap:'Table (6), Book p. 63'}},
   {box:'think',label:'Question',list:[L('Why do firefighters wear helmets of yellow copper rather than red copper? Yellow copper (k = 109) conducts heat much less than red copper (k = 385).','لماذا يلبس رجال الإطفاء خوذًا من النحاس الأصفر لا الأحمر؟ لأن النحاس الأصفر (k = 109) أقل توصيلًا للحرارة من الأحمر (k = 385).')]},
   {h:'Convection'},
   {p:L('The particles of the fluid themselves move, carrying heat. It happens only in fluids. <b>Free convection</b> is driven by gravity (hot air rises); <b>forced convection</b> uses a pump or fan, as in car engine cooling and central heating.','تنتقل دقائق المائع نفسها حاملة الحرارة، ويحدث في الموائع فقط. <b>الحمل الحر</b> بتأثير الجاذبية (الهواء الساخن يرتفع)، و<b>الحمل القسري</b> بمضخة أو مروحة، كما في تبريد محرك السيارة والتدفئة المركزية.')},
   {h:'Radiation'},
   {p:L('Heat travels as electromagnetic waves at the speed of light, even through empty space (from the Sun). The energy emitted depends on the surface (area and colour — black emits more) and the temperature. Good emitters are good absorbers; rough dark surfaces absorb more than smooth light ones.','تنتقل الحرارة بموجات كهرومغناطيسية بسرعة الضوء حتى في الفراغ (من الشمس). تعتمد الطاقة المنبعثة على طبيعة السطح (المساحة واللون، والأسود يشع أكثر) وعلى درجة الحرارة. والمشع الجيد ماص جيد، والسطوح الخشنة الداكنة تمتص أكثر من الملساء الفاتحة.')}
  ]},
  {sn:'4.7',t:'Thermal Pollution',p:'67',blocks:[

  {t:'Heat capacity',eq:'C = m C<sub>p</sub>  ;  Q = C ΔT',d:[['C','heat capacity (J/°C)']],use:L('A calorimeter or a whole object.','المسعر أو الجسم كاملًا.')},
  {t:'Thermal equilibrium',eq:'Σ Q<sub>lost</sub> = Σ Q<sub>gained</sub>',d:[['T<sub>f</sub>','final common temperature']],use:L('Mixtures; include the calorimeter if its heat capacity is given.','الخلائط؛ أضف المسعر إذا أُعطيت سعته الحرارية.')},

 examples:[
  {t:L('Book: heat to raise 3 kg of aluminium from 15 °C to 25 °C (C<sub>p</sub> = 900).','الكتاب: الحرارة اللازمة لرفع درجة حرارة 3 kg من الألمنيوم من 15 إلى 25 °C.'),p:'47',steps:[['Law','Q = m C<sub>p</sub> ΔT'],['Sub','3 × 900 × 10']],res:'Q = 27 000 J'},
  {t:L('Book: a 0.5 kg aluminium cube at 100 °C is put in 1 kg of water at 20 °C. Find the final temperature.','الكتاب: مكعب ألمنيوم 0.5 kg بدرجة 100 °C وُضع في 1 kg ماء بدرجة 20 °C. أوجد درجة الحرارة النهائية.'),p:'49',steps:[['Balance','1 × 4200 (T<sub>f</sub> − 20) = 0.5 × 900 (100 − T<sub>f</sub>)'],['Solve','4650 T<sub>f</sub> = 129 000']],res:'T<sub>f</sub> ≈ 27.7 °C'},
  {t:L('Book: a calorimeter holds 100 g of water at 10 °C; 100 g at 80 °C is added; the mixture reaches 38 °C. Find the calorimeter’s heat capacity.','الكتاب: مسعر فيه 100 g ماء بدرجة 10 °C أُضيف إليه 100 g بدرجة 80 °C فأصبحت 38 °C. أوجد السعة الحرارية للمسعر.'),p:'50',steps:[['Gained','0.1 × 4200 × 28 + 28C = 11 760 + 28C'],['Lost','0.1 × 4200 × 42 = 17 640'],['Solve','28C = 5880']],res:'C = 210 J/°C'},
  {t:L('Book: heat to convert 2 kg of ice at −15 °C to water at 25 °C.','الكتاب: الحرارة اللازمة لتحويل 2 kg جليد بدرجة −15 °C إلى ماء بدرجة 25 °C.'),p:'58',steps:[['Q₁','ice −15→0: 2 × 2093 × 15 = 62 790 J'],['Q₂','melting: 2 × 335 000 = 670 000 J'],['Q₃','water 0→25: 2 × 4200 × 25 = 210 000 J']],res:'Q = 942 790 J'},
  {t:L('Book: a 60 L petrol tank at 25 °C is heated to 45 °C. How much spills? (β = 9.6 × 10⁻⁴)','الكتاب: خزان بنزين 60 L بدرجة 25 °C سخن إلى 45 °C. كم يتسرب؟'),p:'56',steps:[['Law','ΔV = V β ΔT'],['Sub','60 × 9.6 × 10⁻⁴ × 20']],res:'ΔV = 1.152 L'},

  {ty:'open',k:'Give reasons',q:L('Give reasons: steel is suitable for reinforcing cement.','علّل: الحديد الصلب مناسب لتقوية الإسمنت.'),x:L('Both have the same α (12 × 10⁻⁶ /°C), so they expand together without cracking.','لأن لهما معامل التمدد نفسه (12 × 10⁻⁶)، فيتمددان معًا دون تشقق.')},

  {ty:'open',k:'Give reasons',q:L('Give reasons: iron at 0 °C feels colder than wood at 0 °C.','علّل: نشعر أن الحديد بدرجة 0 °C أبرد من الخشب بالدرجة نفسها.'),x:L('Iron is a good conductor and takes heat from the hand quickly; wood is a poor conductor.','الحديد موصل جيد فيسحب الحرارة من اليد بسرعة، والخشب رديء التوصيل.')},
  {ty:'open',k:'Give reasons',q:L('Give reasons: a mercury thermometer in a hot liquid first drops a little, then rises.','علّل: المحرار الزئبقي في سائل ساخن ينخفض قليلًا أولًا ثم يرتفع.'),x:L('The glass heats and expands first, so the level drops; then the mercury heats and expands more than the glass.','يسخن الزجاج ويتمدد أولًا فينخفض المستوى، ثم يسخن الزئبق ويتمدد أكثر من الزجاج.')},

 exam:[
  {m:12,q:L('Heat required to convert 2 kg of water at 30 °C to vapour at 110 °C.','الحرارة اللازمة لتحويل 2 kg ماء بدرجة 30 °C إلى بخار بدرجة 110 °C.'),steps:[['Q₁','2 × 4200 × 70 = 588 000 J'],['Q₂','2 × 2 260 000 = 4 520 000 J'],['Q₃','2 × 2010 × 10 = 40 200 J']],res:'Q = 5 148 200 J',tip:L('Paper A (distinguished, 2026) used this question.','جاء هذا السؤال في الورقة A (المتميزين 2026).')},

  {m:12,q:L('An iron rod 50 cm long and 1 cm² in section: one end at 200 °C, the other at 0 °C (k = 79). Find the thermal gradient and H.','قضيب حديد طوله 50 cm ومقطعه 1 cm²، أحد طرفيه 200 °C والآخر 0 °C (k = 79). أوجد الانحدار الحراري و H.'),steps:[['Gradient','200 / 0.5 = 400 °C/m'],['H','79 × 10⁻⁴ × 400']],res:'400 °C/m ; 3.16 W'},
  {m:10,q:L('A gold piece of 100 g at 25 °C (C<sub>p</sub> = 129) receives 516 J. Find its heat capacity and final temperature.','قطعة ذهب 100 g بدرجة 25 °C (C<sub>p</sub> = 129) تكتسب 516 J. أوجد سعتها الحرارية ودرجة حرارتها النهائية.'),steps:[['C','0.1 × 129 = 12.9 J/°C'],['ΔT','516 / 12.9 = 40 °C']],res:'C = 12.9 J/°C ; T = 65 °C'},
  {m:10,q:L('Heat lost by 500 g of copper cooling from 75 °C to 25 °C (C<sub>p</sub> = 387).','الحرارة التي يفقدها 500 g نحاس عند تبريده من 75 إلى 25 °C.'),steps:[['Sub','0.5 × 387 × (25 − 75)']],res:'Q = −9675 J'},
  {m:8,q:L('Three masses of water 0.5, 0.1 and 1 kg are heated by identical heaters for 3 min. Which rises most in temperature, and why?','ثلاث كتل ماء 0.5 و 0.1 و 1 kg تُسخن بمسخنات متماثلة 3 دقائق. أيها ترتفع درجة حرارتها أكثر، ولماذا؟'),steps:[['Same Q','ΔT = Q / (m C<sub>p</sub>)'],['So','smallest mass ⇒ largest ΔT']],res:'0.1 kg'},
  {m:8,q:L('Equal masses of water and oil are heated for the same time. Which warms faster, and why?','كتلتان متساويتان من الماء والزيت تُسخنان المدة نفسها. أيهما يسخن أسرع، ولماذا؟'),steps:[['Reason','oil has a smaller specific heat than water']],res:'the oil'}

(window.XL=window.XL||[]).push({ch:4,t:'Heating curve calculator',d:L('Choose a mass of water/ice and the start and end temperatures. Every stage of the heating curve is calculated with the book’s constants.','اختر كتلة الماء أو الجليد ودرجتي البداية والنهاية، وستُحسب كل مرحلة من منحنى التسخين بثوابت الكتاب.'),
 html:`<div class="calc"><label>Mass (kg)<input id="qm" type="number" value="2" step="any"></label><label>Start T (°C)<input id="qT1" type="number" value="-15"></label><label>End T (°C)<input id="qT2" type="number" value="110"></label></div><div id="qOut" style="margin-top:10px"></div>`,
 init(){const d=()=>{const m=+$('#qm').value,a=+$('#qT1').value,b=+$('#qT2').value;const st=[];let tot=0;const lo=Math.min(a,b),hi=Math.max(a,b),sg=b>=a?1:-1;
  const add=(k,v)=>{st.push([k,`${sci(v*sg)} J`]);tot+=v};
  if(lo<0) add('ice '+lo+'→'+Math.min(hi,0)+' °C',m*2093*(Math.min(hi,0)-lo));
  if(lo<=0&&hi>0) add('melting at 0 °C',m*335000);
  if(hi>0&&lo<100) add('water '+Math.max(lo,0)+'→'+Math.min(hi,100)+' °C',m*4200*(Math.min(hi,100)-Math.max(lo,0)));
  if(lo<100&&hi>=100&&hi>lo) add('boiling at 100 °C',m*2260000);
  if(hi>100) add('steam '+Math.max(lo,100)+'→'+hi+' °C',m*2010*(hi-Math.max(lo,100)));
  $('#qOut').innerHTML=steps(st.length?st:[['—','no change']])+`<div class="res">✓ Q = ${sci(tot*sg)} J ${sg<0?'(heat removed)':''}</div>`};['qm','qT1','qT2'].forEach(i=>$('#'+i).oninput=d);d();}});

 init(){const d=()=>{const I1=+$('#pI1').value,I2=+$('#pI2').value,D=+$('#pD').value,x=+$('#pX').value*D;const E1=I1/x**2,E2=I2/(D-x)**2;const xe=D/(1+Math.sqrt(I2/I1));
  const X=v=>30+v/D*460;const sh=Math.min(1,E1/Math.max(E1,E2)),sh2=Math.min(1,E2/Math.max(E1,E2));
  $('#pSvg').innerHTML=`<g font-family="IBM Plex Mono, monospace" font-size="11"><line x1="30" y1="60" x2="490" y2="60" stroke="var(--muted)"/><circle cx="30" cy="40" r="10" fill="var(--c5)"/><circle cx="490" cy="40" r="10" fill="var(--c5)"/><rect x="${X(x)-8}" y="15" width="8" height="45" fill="var(--c5)" opacity="${0.25+0.75*sh}"/><rect x="${X(x)}" y="15" width="8" height="45" fill="var(--c5)" opacity="${0.25+0.75*sh2}"/><text x="30" y="82" text-anchor="middle" fill="var(--muted)">I₁</text><text x="490" y="82" text-anchor="middle" fill="var(--muted)">I₂</text><path d="M${X(xe)} 62 v8" stroke="var(--good)" stroke-width="2"/></g>`;
  $('#pOut').innerHTML=steps([['E₁',`I₁/r₁² = ${sci(E1)} lux (r₁ = ${x.toFixed(2)} m)`],['E₂',`I₂/r₂² = ${sci(E2)} lux (r₂ = ${(D-x).toFixed(2)} m)`]])+(Math.abs(E1-E2)/Math.max(E1,E2)<0.03?`<div class="res">✓ Balanced: equal illuminance</div>`:`<div class="alert bad">Not balanced — equal illuminance is at ${xe.toFixed(2)} m from lamp 1 (green mark)</div>`)};
  ['pI1','pI2','pD','pX'].forEach(i=>$('#'+i).oninput=d);d();}});

     L('<b>Refraction of light:</b> the change of direction of a light ray moving obliquely between two transparent media of different optical density.','<b>انكسار الضوء:</b> تغير اتجاه الشعاع الضوئي عند انتقاله بصورة مائلة بين وسطين شفافين مختلفين في الكثافة الضوئية.'),
     L('<b>Optical density:</b> a property of a transparent medium on which the speed of light in it depends. Greater optical density ⇒ lower speed of light.','<b>الكثافة الضوئية:</b> خاصية للوسط الشفاف تعتمد عليها سرعة الضوء فيه. كلما ازدادت الكثافة الضوئية قلت سرعة الضوء.')]},
